<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — Habit &amp; Work Tracker</title>

<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12151a">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&family=Kalam:wght@400;700&display=swap');

  :root{
    --bg:#12151a;
    --surface:#1b2027;
    --surface-2:#232a33;
    --surface-3:#2b333f;
    --cream:#f1e8d6;
    --cream-dim:#dccfab;
    --ink:#241f16;
    --text:#ece8e0;
    --text-dim:#9aa3ad;
    --text-faint:#5c6572;
    --accent:#e8a33d;
    --accent-dim:#7a5a26;
    --accent2:#4fa8a0;
    --danger:#d9695a;
    --line:#2f3742;
    --xp:#9bb6e9;
    --xp2:#1c53b9;
    --font-display:'Space Grotesk', 'Arial Black', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-hand:'Kalam', 'Comic Sans MS', cursive;
    --radius:14px;
    --paper:#fbf5e4;
    --paper-line:#b9c4e8;
    --paper-margin:#d98a82;
    --journal-ink:#2c2416;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(232,163,61,0.07), transparent 45%),
      radial-gradient(circle at 90% 30%, rgba(79,168,160,0.06), transparent 40%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:40px;
  }

  #app{
    max-width:480px;
    margin:0 auto;
    padding:0 16px 24px;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:22px 2px 18px;
    position:sticky;
    top:0;
    background:linear-gradient(var(--bg) 80%, transparent);
    z-index:5;
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
  }
  .stamp-mark{
    width:34px; height:34px;
    border-radius:50%;
    border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:13px;
    flex-shrink:0;
    transform:rotate(-8deg);
  }
  .topbar h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    margin:0;
    flex:1;
  }
  .topbar h1 span{ color:var(--accent);  }
  .icon-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    width:40px; height:40px;
    border-radius:10px;
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{ background:var(--surface-3); }

  /* ---------- Tabs ---------- */
  /* Tab pills are hidden — navigation between tabs is swipe/slide-only (see .tabs-scroller). */
  .tabs-nav{
    display:none;
    gap:8px;
    overflow-x:auto;
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    padding:2px 16px 14px;
  }
  .tab-pill{
    flex-shrink:0;
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-pill.active{ background:var(--accent); color:#211505; border-color:var(--accent); }
  .tab-pill:active{ filter:brightness(0.95); }

  .tabs-scroller{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
  }
  .tab-page{
    flex:0 0 100%;
    scroll-snap-align:start;
    max-width:480px;
    width:100%;
    margin:0 auto;
    padding:0 16px 24px;
    box-sizing:border-box;
    min-width:0;
  }

  /* ---------- Category cards ---------- */
  /* ---------- Tamagotchi companion ---------- */
  .tama-card{
    background:var(--cream);
    border-radius:20px;
    padding:12px;
    display:flex;
    gap:14px;
    align-items:stretch;
    margin-bottom:18px;
    position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 6px 16px rgba(0,0,0,0.25);
  }
  .tama-card::before, .tama-card::after,
  .tama-screws span{ }
  .tama-screws{
    position:absolute; inset:6px;
    pointer-events:none;
  }
  .tama-screws span{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--cream-dim);
    box-shadow:inset 0 1px 1px rgba(0,0,0,0.35);
  }
  .tama-screws span:nth-child(1){ top:0; left:0; }
  .tama-screws span:nth-child(2){ top:0; right:0; }
  .tama-screws span:nth-child(3){ bottom:0; left:0; }
  .tama-screws span:nth-child(4){ bottom:0; right:0; }

  .tama-screen{
    width:104px;
    height:104px;
    flex-shrink:0;
    border-radius:14px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 35% 25%, #1c2a28, var(--bg) 75%);
    border:3px solid var(--ink);
    box-shadow:inset 0 0 0 2px rgba(232,163,61,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .tama-sprite{
    width:80px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,0.4));
  }
  @keyframes tamaBob{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  .tama-lvl-badge{
    position:absolute;
    top:5px; left:5px;
    background:rgba(0,0,0,0.55);
    color:var(--xp);
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:6px;
    letter-spacing:0.5px;
    z-index:1;
  }

  .tama-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    color:var(--ink);
  }
  .tama-name-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .tama-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
  }
  .tama-caption{
    font-size:11px;
    color:#6b6250;
  }
  .tama-pips{
    display:flex;
    gap:4px;
    margin-left:auto;
  }
  .tama-pips span{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--xp2);
    border:1px solid var(--xp);
  }
  .tama-pips span.filled{ background:var(--xp); border-color:var(--xp2); }

  .xp-track{
    height:9px;
    background:rgba(36,31,22,0.15);
    border-radius:5px;
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    background:linear-gradient(90deg, var(--xp), var(--xp2));
    border-radius:5px;
    transition:width 0.5s ease;
    width:0%;
  }
  .xp-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    color: --var(--ink);
  }

  /* ---------- HP bar ---------- */
  .hp-row{ display:flex; align-items:center; gap:6px; }
  .hp-track{
    flex:1;
    height:8px;
    background:rgba(36,31,22,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .hp-fill{
    height:100%;
    background:linear-gradient(90deg, #8bbf5a, #4f9c4a);
    border-radius:4px;
    transition:width 0.5s ease, background 0.3s ease;
    width:100%;
  }
  .hp-fill.low{ background:linear-gradient(90deg, #e8c33d, #c98f2a); }
  .hp-fill.critical{ background:linear-gradient(90deg, #e8746a, #b23c2c); }
  .hp-label{
    font-family:var(--font-mono);
    font-size:9.5px;
    color:var(--ink);
    white-space:nowrap;
    flex-shrink:0;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 12px);
    background:var(--ink);
    color:var(--cream);
    font-size:13px;
    font-weight:600;
    padding:11px 18px;
    border-radius:30px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    z-index:80;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    max-width:88%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  .category-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }

  /* ---------- Daily 3 things ---------- */
  .daily-todo-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .daily-todo-header{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .daily-todo-title{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .daily-todo-date{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); margin-left:auto; }
  .daily-todo-list{ display:flex; flex-direction:column; gap:8px; }
  .daily-todo-row{ display:flex; align-items:center; gap:8px; }
  .daily-todo-check{
    width:24px; height:24px; flex-shrink:0;
    border-radius:7px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--accent2); font-size:13px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .daily-todo-check.done{ background:var(--accent2); color:#0c2320; border-color:var(--accent2); }
  .daily-todo-input{
    flex:1; min-width:0;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:8px; font-size:13.5px; font-family:var(--font-body);
  }
  .daily-todo-row.done .daily-todo-input{ color:var(--text-faint); text-decoration:line-through; }

  /* ---------- Sleep tracker ---------- */
  .sleep-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .sleep-header{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .sleep-title{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .sleep-header .chip-freq-btn{ margin-left:auto; font-size:12px; }
  .sleep-empty{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); line-height:1.5; }
  .sleep-times{ display:flex; gap:22px; }
  .sleep-stat{ display:flex; flex-direction:column; gap:2px; }
  .sleep-stat-label{
    font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--text-faint);
  }
  .sleep-stat-value{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .sleep-note{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-top:8px; }

  .category-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 14px;
    position:relative;
    overflow:hidden;
    margin-bottom:12px;
  }
  .category-card::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--cat-color, var(--accent2));
  }

  .cat-header{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cat-icon{ font-size:20px; width:26px; text-align:center; flex-shrink:0; }
  .cat-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cat-meta{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; }

  .streak-stamp{
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .streak-stamp.active{ color:var(--accent); border:1px solid var(--accent-dim); background:rgba(232,163,61,0.08); }
  .streak-stamp.stale{ color:var(--text-faint); border:1px solid var(--line); }
  .streak-stamp.none{ color:var(--text-faint); border:1px solid var(--line); }

  .week-total{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--accent2);
  }

  .type-select{
    width:100%;
    margin-top:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    padding:11px 12px;
    border-radius:10px;
    appearance:none;
  }

  .type-detail{
    margin-top:12px;
    background:var(--surface-2);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:12px;
  }
  .type-detail[hidden]{ display:none; }

  .type-overview{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .type-overview .t-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
  }
  .type-overview .t-info{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
  }

  .log-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .step-btn{
    width:38px; height:38px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--surface-3);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:700;
    flex-shrink:0;
    cursor:pointer;
  }
  .step-btn:active{ background:var(--accent-dim); }
  .minutes-input{
    flex:1;
    min-width:0;
    text-align:center;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--accent);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:16px;
    padding:9px 4px;
    border-radius:9px;
  }
  .minutes-input::-webkit-outer-spin-button,
  .minutes-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .log-btn{
    background:var(--accent);
    color:#211505;
    border:none;
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    padding:0 16px;
    height:38px;
    border-radius:9px;
    cursor:pointer;
    flex-shrink:0;
  }
  .log-btn:active{ filter:brightness(0.9); }
  .log-confirm{
    margin-top:8px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--accent2);
    display:none;
  }

  .add-type-form{ display:flex; gap:8px; margin-top:10px; }
  .add-type-form input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:9px;
    font-size:14px;
  }
  .add-type-form button{
    background:var(--accent2);
    color:#0c2320;
    border:none;
    font-weight:700;
    padding:0 14px;
    border-radius:9px;
    font-size:13px;
    cursor:pointer;
  }

  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:30px 10px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    font-size:14px;
  }

  /* ---------- Compact activity list ---------- */
  .type-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .type-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
  }
  .type-check{
    width:24px; height:24px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--accent2);
    font-size:13px;
    font-weight:700;
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .type-check.done{ background:var(--accent2); color:#0c2320; border-color:var(--accent2); }
  .type-row-main{ flex:1; min-width:0; cursor:pointer; }
  .type-row-top{ display:flex; align-items:center; gap:5px; }
  .type-row-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:13.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .type-row-since{
    margin-left:auto;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-dim);
    flex-shrink:0;
    white-space:nowrap;
    padding-left:6px;
  }
  .type-row-chevron{ color:var(--text-faint); font-size:14px; flex-shrink:0; }

  .heatmap{ display:flex; gap:2px; margin-top:6px; }
  .heatmap-cell{ width:7px; height:9px; border-radius:2px; flex-shrink:0; }
  .heatmap.large{ gap:3px; margin-top:8px; }
  .heatmap.large .heatmap-cell{ width:16px; height:16px; border-radius:3px; }
  .heatmap-divider { width:1px; height:9px; background:var(--accent-dim); border-radius:1px; flex-shrink:0; }

  .add-type-row{
    background:none;
    border:1px dashed var(--line);
    color:var(--accent2);
    border-radius:10px;
    padding:10px;
    font-size:13px;
    font-weight:700;
    font-family:var(--font-body);
    cursor:pointer;
    width:100%;
  }

  /* ---------- Detail popup ---------- */
  .detail-header{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .detail-cat-icon{ font-size:28px; flex-shrink:0; }
  .detail-title{ font-family:var(--font-display); font-weight:700; font-size:18px; display:flex; align-items:center; }
  .detail-title .candy-icon{ width:18px; height:18px; }
  .detail-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:3px; }
  .detail-stats{ display:flex; gap:20px; margin-bottom:6px; }
  .detail-stat{ display:flex; flex-direction:column; gap:2px; }
  .detail-stat-label{
    font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--text-faint);
  }
  .detail-stat-value{ font-family:var(--font-display); font-weight:700; font-size:14px; }
  .detail-heatmap-label{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); margin-top:10px; }
  .detail-check-btn{ margin-top:18px; }
  .detail-check-btn:disabled{ opacity:0.6; cursor:default; }

  /* ---------- Due items (frequency reminders) ---------- */
  .due-section{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .due-item{
    background:rgba(232,163,61,0.08);
    border:1px solid var(--accent-dim);
    border-radius:10px;
    padding:10px;
  }
  .due-item-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .due-badge{
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:700;
    letter-spacing:0.5px;
    color:var(--accent);
    background:rgba(232,163,61,0.15);
    padding:2px 7px;
    border-radius:12px;
    flex-shrink:0;
  }
  .due-name{ font-family:var(--font-display); font-weight:700; font-size:13.5px; }
  .due-sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin:4px 0 8px;
  }

  /* ---------- XP/HP multiplier candy ---------- */
  .candy-icon{
    width:14px; height:14px;
    vertical-align:-2px;
    margin-right:3px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  .mult-note{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--accent2);
    margin:-4px 0 10px;
  }
  .chip-candy{
    width:14px; height:14px;
    vertical-align:middle;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  .chip-mult-btn{
    background:none; border:none; color:var(--accent); font-size:11px; font-family:var(--font-mono);
    cursor:pointer; display:inline-flex; align-items:center; gap:3px; padding:0 2px;
  }

  /* ---------- Bad habit tag / frequency badge ---------- */
  .bad-tag{
    font-size:9.5px;
    font-family:var(--font-mono);
    color:var(--danger);
    border:1px solid var(--danger);
    padding:1px 6px;
    border-radius:10px;
    margin-left:5px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .freq-badge{
    font-size:10px;
    font-family:var(--font-mono);
    color:var(--accent2);
    border:1px solid var(--accent2);
    padding:1px 6px;
    border-radius:10px;
    margin-left:4px;
  }
  .chip-freq-btn{
    background:none; border:none; color:var(--accent2); font-size:13px; cursor:pointer; line-height:1;
    padding:0 2px;
  }
  .checkbox-row{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--text-dim);
    margin-top:12px;
    text-transform:none;
    letter-spacing:normal;
  }
  .new-cat-form input[type="checkbox"]{ width:auto; margin:0; }

  /* ---------- Journal widget (lined paper) ---------- */
  .journal-card{
    position:relative;
    margin-bottom:12px;
    border-radius:12px;
    padding:16px 16px 14px 40px;
    color:var(--journal-ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(90deg, transparent 22px, var(--paper-margin) 22px, var(--paper-margin) 23px, transparent 23px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 26px, var(--paper-line) 26px, var(--paper-line) 27px);
    box-shadow:0 1px 0 rgba(255,255,255,0.4) inset, 0 6px 16px rgba(0,0,0,0.25);
    border:1px solid #e3d7ae;
  }
  .journal-header{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .journal-title{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--journal-ink); }
  .journal-streak{
    font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:2px 8px;
    border-radius:20px; white-space:nowrap;
  }
  .journal-streak.active{ color:#8a4a1a; background:rgba(217,138,51,0.18); border:1px solid rgba(217,138,51,0.4); }
  .journal-streak.stale{ color:#7a6f57; background:rgba(90,80,50,0.08); border:1px solid rgba(90,80,50,0.2); }
  .journal-streak.none{ color:#8a8064; background:rgba(90,80,50,0.06); border:1px solid rgba(90,80,50,0.15); }
  .journal-history-btn{
    margin-left:auto;
    background:rgba(44,36,22,0.08);
    border:1px solid rgba(44,36,22,0.25);
    color:var(--journal-ink);
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:700;
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
  }
  .journal-textarea{
    width:100%;
    min-height:135px;
    background:transparent;
    border:none;
    outline:none;
    resize:vertical;
    color:#1c2c56;
    font-family:var(--font-hand);
    font-size:16px;
    line-height:27px;
    padding:0;
    margin:0;
  }
  .journal-textarea::placeholder{ color:rgba(44,36,22,0.4); font-family:var(--font-hand); }
  .journal-footer{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin-top:6px; flex-wrap:wrap;
  }
  .journal-wordcount{ font-family:var(--font-mono); font-size:11.5px; font-weight:700; color:var(--journal-ink); }
  .journal-tier-note{ font-family:var(--font-mono); font-size:10.5px; color:#7a6f4f; }
  .journal-heatmap-wrap{ margin-top:10px; }
  .journal-heatmap .heatmap-cell{ border:1px solid rgba(44,36,22,0.08); }
  .journal-heatmap .heatmap-divider{ background:var(--paper-margin); }

  .journal-history-list{ display:flex; flex-direction:column; gap:8px; }
  .journal-history-item{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:9px 11px; cursor:pointer; font-family:var(--font-body);
  }
  .journal-history-item:active{ background:var(--surface-3); }
  .journal-history-date{ font-family:var(--font-display); font-weight:700; font-size:12.5px; flex-shrink:0; width:82px; }
  .journal-history-preview{ flex:1; min-width:0; font-size:12px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .journal-history-words{ font-family:var(--font-mono); font-size:11px; color:var(--accent2); flex-shrink:0; }
  .journal-entry-full{
    background:var(--paper); color:var(--journal-ink); border-radius:10px; padding:14px;
    font-family:var(--font-hand); font-size:15px; line-height:1.6; white-space:pre-wrap;
    border:1px solid #e3d7ae; max-height:50vh; overflow-y:auto;
  }
  .journal-entry-meta{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:8px; }

  /* ---------- Calendar overview ---------- */
  .calendar-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .calendar-header{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .calendar-header .chip-freq-btn{ font-size:16px; padding:0 6px; }
  .calendar-month-label{ font-family:var(--font-display); font-weight:700; font-size:14px; flex:1; text-align:center; }
  .calendar-today-btn{
    background:none; border:1px solid var(--line); color:var(--accent2);
    font-family:var(--font-mono); font-size:11px; padding:4px 9px; border-radius:14px; cursor:pointer;
  }
  .calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .calendar-weekdays{ margin-bottom:4px; }
  .cal-weekday{ text-align:center; font-family:var(--font-mono); font-size:10px; color:var(--text-faint); }
  .cal-day-cell{
    aspect-ratio:1;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:4px 2px 3px;
    cursor:pointer;
    position:relative;
    color:var(--text);
    font-family:var(--font-mono);
  }
  .cal-day-empty{ visibility:hidden; cursor:default; border:none; background:none; }
  .cal-day-num{ font-size:11px; font-weight:700; }
  .cal-today .cal-day-num{ color:var(--accent); }
  .cal-selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .cal-day-dots{ display:flex; gap:2px; flex-wrap:wrap; justify-content:center; margin-top:3px; max-width:100%; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .cal-dot-journal{ width:auto; height:auto; font-size:7px; background:none !important; line-height:1; }

  .calendar-detail{ margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; }
  .calendar-detail-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-family:var(--font-display); font-size:13px; }
  .calendar-detail-head .chip-freq-btn{ font-size:16px; }
  .cal-detail-total{ font-family:var(--font-mono); font-size:11px; color:var(--accent2); margin-bottom:6px; }
  .cal-detail-row{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .cal-detail-row:last-child{ border-bottom:none; }
  .cal-detail-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-detail-mins{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); }
  .cal-detail-journal{ margin-top:8px; font-family:var(--font-mono); font-size:11px; color:var(--accent2); }

  /* ---------- Reminders (quick-add + upcoming) ---------- */
  .reminder-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .reminder-add-header, .reminder-upcoming-header{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .reminder-add-title{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .reminder-pill-btn{
    background:none; border:1px solid var(--line); color:var(--accent2);
    font-family:var(--font-mono); font-size:11px; padding:4px 9px; border-radius:14px; cursor:pointer;
    white-space:nowrap;
  }
  .reminder-add-header .reminder-pill-btn{ margin-left:auto; }
  .reminder-upcoming-header .reminder-pill-btn + .reminder-pill-btn{ margin-left:8px; }
  .reminder-quick-row{ display:flex; gap:8px; }
  .reminder-quick-input{
    flex:1; min-width:0;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 10px; border-radius:9px; font-size:13.5px; font-family:var(--font-body);
  }
  .reminder-quick-add-btn{
    background:var(--accent); color:#211505; border:none;
    font-family:var(--font-display); font-weight:700; font-size:13px;
    padding:0 16px; border-radius:9px; cursor:pointer;
  }
  .reminder-quick-hint{
    font-family:var(--font-mono); font-size:10px; color:var(--text-faint);
    margin:6px 2px 2px;
  }
  .reminder-sub-label{
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-faint); margin:12px 0 6px 2px;
  }
  .reminder-empty{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); padding:6px 2px; }

  .reminder-row{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:8px 9px; margin-bottom:6px;
  }
  .reminder-row.done .reminder-row-text{ color:var(--text-faint); text-decoration:line-through; }
  .reminder-check{
    width:22px; height:22px; flex-shrink:0;
    border-radius:7px; border:1px solid var(--line); background:var(--bg);
    color:var(--accent2); font-size:12px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .reminder-check.done{ background:var(--accent2); color:#0c2320; border-color:var(--accent2); }
  .reminder-row-main{ flex:1; min-width:0; cursor:pointer; }
  .reminder-row-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .reminder-row-text{
    font-size:13px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
  }
  .reminder-row-when{
    font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
    margin-left:auto; white-space:nowrap; flex-shrink:0; padding-left:6px;
  }
  .reminder-del{
    background:none; border:none; color:var(--text-faint); font-size:16px; cursor:pointer;
    flex-shrink:0; line-height:1; padding:2px 4px;
  }
  .reminder-del:active{ color:var(--danger); }
  .reminder-pri{ font-weight:700; font-size:12px; flex-shrink:0; }
  .reminder-pri-1{ color:var(--accent); }
  .reminder-pri-2{ color:var(--danger); }

  .reminder-day-scroller{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; touch-action:pan-x;
    margin:0 -14px; padding:0 14px;
  }
  .reminder-day-page{ flex:0 0 100%; scroll-snap-align:start; min-width:0; box-sizing:border-box; padding-right:14px; }
  .reminder-day-label{
    font-family:var(--font-display); font-weight:700; font-size:13px; margin-bottom:8px;
  }

  .reminder-week-list{ display:flex; flex-direction:column; gap:8px; }
  .reminder-week-row{ display:flex; gap:10px; align-items:flex-start; }
  .reminder-week-date{
    font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim);
    width:64px; flex-shrink:0; padding-top:3px;
  }
  .reminder-week-items{ flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:5px; }
  .reminder-week-chip{
    background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    padding:3px 9px; font-size:11px; cursor:pointer; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .reminder-week-empty{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); padding-top:3px; }

  /* ---------- Timer popup ---------- */
  .timer-card{ text-align:center; }
  .timer-screen{
    position:relative;
    height:120px;
    border-radius:14px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 35% 25%, #1c2a28, var(--bg) 75%);
    border:3px solid var(--ink);
    box-shadow:inset 0 0 0 2px rgba(232,163,61,0.25);
    overflow:hidden;
    margin-bottom:16px;
  }
  .timer-sprite{
    position:absolute;
    bottom:12px;
    left:0px;
    width:64px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,0.4));
    animation: tamaBob 1s ease-in-out infinite;
  }
  .timer-readout{
    font-family:var(--font-mono);
    font-size:36px;
    font-weight:700;
    color:var(--accent);
    margin-bottom:6px;
    letter-spacing:1px;
  }
  .timer-sub{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:16px;
  }
  .timer-actions{ display:flex; gap:10px; }
  .timer-actions button{ flex:1; margin-top:0; }
  .timer-actions .mini-danger{ padding:12px; font-size:13px; border-radius:10px; }

  /* ---------- Recent log (ticket stubs) ---------- */
  .recent-log{ margin-bottom:8px; }
  .recent-log h2{
    font-family:var(--font-display);
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 10px 4px;
  }
  .log-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .log-item{
    background:var(--cream);
    color:var(--ink);
    border-radius:10px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    background-image: radial-gradient(circle 5px at 0px 50%, var(--bg) 99%, transparent 100%),
                       radial-gradient(circle 5px at 100% 50%, var(--bg) 99%, transparent 100%);
  }
  .log-item .li-icon{ font-size:17px; width:22px; text-align:center; flex-shrink:0; }
  .log-item .li-main{ flex:1; min-width:0; }
  .log-item .li-title{ font-weight:600; font-size:13.5px; }
  .log-item .li-sub{ font-family:var(--font-mono); font-size:10.5px; color:#6b6250; margin-top:1px; }
  .log-item .li-dur{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:13px;
    background:var(--ink);
    color:var(--cream);
    padding:3px 8px;
    border-radius:6px;
    flex-shrink:0;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px 18px 0 0;
    width:100%;
    max-width:480px;
    max-height:85vh;
    overflow-y:auto;
    padding:20px 18px 28px;
    position:relative;
    animation:slideUp 0.18s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0.6; } to{ transform:none; opacity:1; } }
  .modal-close{
    position:absolute; top:14px; right:14px;
    width:32px; height:32px;
    border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:18px;
    cursor:pointer;
  }
  .modal-card h2{
    font-family:var(--font-display);
    font-size:18px;
    margin:0 0 16px;
    padding-right:34px;
  }

  .manage-cat-block{
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
    background:var(--surface-2);
  }
  .manage-cat-head{
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .manage-cat-head strong{ font-family:var(--font-display); font-size:14px; flex:1; }
  .mini-danger{
    background:none; border:1px solid var(--danger); color:var(--danger);
    border-radius:7px; font-size:11px; padding:5px 9px; cursor:pointer;
  }
  .type-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .type-chip{
    background:var(--surface-3);
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 8px 5px 11px;
    font-size:12px;
    display:flex; align-items:center; gap:6px;
  }
  .type-chip button{
    background:none; border:none; color:var(--danger); font-size:14px; cursor:pointer; line-height:1;
    padding:0;
  }
  .inline-add{ display:flex; gap:6px; }
  .inline-add input{
    flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:7px 9px; border-radius:7px; font-size:12.5px;
  }
  .inline-add button{
    background:var(--accent2); color:#0c2320; border:none; border-radius:7px;
    padding:0 12px; font-size:12px; font-weight:700; cursor:pointer;
  }

  .tab-manage-block{
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px;
    margin-bottom:8px;
    background:var(--surface-3);
  }
  .tab-manage-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .tab-name-input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:7px 9px; border-radius:7px; font-size:13px; font-family:var(--font-body);
  }

  .new-cat-form{
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:6px;
  }
  .new-cat-form label{
    display:block; font-size:11px; color:var(--text-dim); margin-bottom:4px; margin-top:10px;
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .new-cat-form input, .new-cat-form select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:10px; border-radius:9px; font-size:14px;
  }
  .new-cat-form .swatches{ display:flex; gap:8px; margin-top:6px; }
  .swatch{
    width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  }
  .swatch.selected{ border-color:var(--text); }
  .primary-btn{
    width:100%; margin-top:16px;
    background:var(--accent); color:#211505; border:none;
    font-family:var(--font-display); font-weight:700; font-size:14px;
    padding:12px; border-radius:10px; cursor:pointer;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>

<body>

  ];

  var EVOLVE_AT_LEVEL = [1, 5, 9]; // level thresholds for stage 0 / 1 / 2 (final)
  var XP_PER_MINUTE = 10;          // 15 min log = 150 XP
  var STREAK_BONUS_PER_DAY = 10;   // extra XP per active streak day (capped below)
  var STREAK_BONUS_CAP_DAYS = 10;

  /* ---------------- Health (bad habits) ---------------- */
  var BAD_HEALTH_PER_MINUTE = 2;   // 15 min of a bad habit = -30 HP
  function maxHealthForLevel(level){ return 100 + (level - 1) * 10; }   // HP grows with level
  function healthRestoreForLevel(level){ return 15 + level * 2; }       // daily regen also grows with level

  /* ---------------- Per-activity XP/HP multiplier (Exp. Candy tiers) ---------------- */
  var MULTIPLIER_TIERS = [
    { key: 'xs', mult: 1,   label: 'XS', sprite: 'https://static.wikia.nocookie.net/pokemon/images/8/83/Exp._Candy_XS_sprite.png/revision/latest?cb=20201206064558' },
    { key: 'm',  mult: 1.5, label: 'M',  sprite: 'https://static.wikia.nocookie.net/pokemon/images/b/bd/Exp._Candy_M_sprite.png/revision/latest?cb=20201206064637' },
    { key: 'xl', mult: 2,   label: 'XL', sprite: 'https://static.wikia.nocookie.net/pokemon/images/2/20/Exp._Candy_XL_sprite.png/revision/latest?cb=20201206064705' }
  ];
  var MULTIPLIER_ORDER = ['xs', 'm', 'xl'];
  function getMultiplierTier(type){
    var key = (type && type.multiplierTier) || 'xs';
    for(var i=0; i<MULTIPLIER_TIERS.length; i++){ if(MULTIPLIER_TIERS[i].key === key) return MULTIPLIER_TIERS[i]; }
    return MULTIPLIER_TIERS[0];
  }
  function cycleMultiplierTier(type){
    var cur = (type.multiplierTier) || 'xs';
    var idx = MULTIPLIER_ORDER.indexOf(cur);
    type.multiplierTier = MULTIPLIER_ORDER[(idx + 1) % MULTIPLIER_ORDER.length];
  }

  // Single place that actually records a log entry and applies its XP/HP effect (scaled by
  // the activity's candy multiplier). Used by the manual log button, the auto-surfaced due
  // items, and the timer popup, so all three stay in sync.
  function commitLog(catId, typeId, mins){
    var cat = findCat(catId);
    var type = cat && findType(cat, typeId);
    if(!cat || !type || !mins || mins <= 0) return;

    state.logs.push({ id: uid('log'), catId: catId, typeId: typeId, minutes: mins, ts: Date.now() });
    saveState();

    var tier = getMultiplierTier(type);
    if(cat.isBad){
      damagePokemonHealth(Math.round(mins * BAD_HEALTH_PER_MINUTE * tier.mult), type.name);
    } else {
      var postStreak = streakInfo(entriesFor(catId, typeId));
      var xpGain = mins * XP_PER_MINUTE;
      if(postStreak.type === 'active' && postStreak.streak >= 2){
        xpGain += Math.min(postStreak.streak, STREAK_BONUS_CAP_DAYS) * STREAK_BONUS_PER_DAY;
      }
      addPokemonXp(Math.round(xpGain * tier.mult));
    }

    renderTabs();
  }

  // Cumulative XP required to REACH level n+1, starting from level 1 at 0 XP.
  function xpThreshold(n){
    var total = 0;
    for(var i=1; i<=n; i++){ total += 100*i + 25*i*(i-1); }
    return total;
  }

  var DEFAULT_STATE = {
    categories: [
      { id:'cat_music', name:'Music', icon:'🎵', color:CAT_COLORS[0],
        types:[ {id:'t_piano', name:'Piano'}, {id:'t_guitar', name:'Guitar'} ] },
      { id:'cat_exercise', name:'Exercise', icon:'🏃', color:CAT_COLORS[1],
        types:[ {id:'t_run', name:'Running'}, {id:'t_gym', name:'Gym'} ] }
    ],
    logs: [] // {id, catId, typeId, minutes, ts}
  };

  var state = loadState();
  var openTypeByCat = {}; // catId -> typeId currently expanded in that card (legacy, unused but harmless)
  var currentTabIndex = 0;

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      var parsed = JSON.parse(raw);
      if(!parsed.categories) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      return parsed;
    }catch(e){
      console.warn('Could not read saved data, starting fresh.', e);
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.warn('Could not save data (storage may be unavailable/full).', e);
    }
  }

  function uid(prefix){
    return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
  }

  /* ---------------- Tabs (layout) ---------------- */
  // Widgets are referenced by key: 'companion', 'dailyTodos', 'sleep', 'history', or a category id.
  // Each tab has an ordered widget list. Companion defaults to the first slot of every tab.
  function ensureTabs(){
    if(!state.tabs || !state.tabs.length){
      var widgets = ['companion', 'dailyTodos', 'reminderAdd', 'reminderUpcoming', 'sleep', 'journal', 'calendar'];
      state.categories.forEach(function(c){ widgets.push(c.id); });
      widgets.push('history');
      state.tabs = [{ id: uid('tab'), name: 'Main', widgets: widgets }];
      saveState();
    }
    if(currentTabIndex >= state.tabs.length) currentTabIndex = Math.max(0, state.tabs.length - 1);
  }

  function widgetLabel(key){
    if(key === 'companion') return '🐾 Companion';
    if(key === 'dailyTodos') return '🎯 Today\'s 3';
    if(key === 'reminderAdd') return '⏰ Reminders';
    if(key === 'reminderUpcoming') return '📆 Upcoming';
    if(key === 'sleep') return '😴 Sleep';
    if(key === 'journal') return '📓 Journal';
    if(key === 'calendar') return '📅 Calendar';
    if(key === 'history') return '📜 History';
    var cat = findCat(key);
    return cat ? (cat.icon || '📌') + ' ' + escapeHtml(cat.name) : '(removed)';
  }

  function availableWidgetOptions(tab){
    var all = [['companion', '🐾 Companion'], ['dailyTodos', '🎯 Today\'s 3'], ['reminderAdd', '⏰ Reminders'], ['reminderUpcoming', '📆 Upcoming'], ['sleep', '😴 Sleep'], ['journal', '📓 Journal'], ['calendar', '📅 Calendar'], ['history', '📜 History']];
    state.categories.forEach(function(c){ all.push([c.id, (c.icon || '📌') + ' ' + c.name]); });
    return all.filter(function(pair){ return tab.widgets.indexOf(pair[0]) === -1; })
      .map(function(pair){ return '<option value="' + pair[0] + '">' + escapeHtml(pair[1]) + '</option>'; }).join('');
  }

  /* ---------------- Companion helpers ---------------- */
  // A simple, DST-safe "week index" (Monday-anchored) used to decide when to roll a new companion.
  function weekIndex(ts){
    var d = new Date(ts);
    var localMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var epochMonday = new Date(1970, 0, 5).getTime(); // Jan 5 1970 was a Monday
    return Math.floor((localMidnight - epochMonday) / (86400000 * 7));
  }

  var pokemonJustRolled = false;

  function ensurePokemon(){
    var wk = weekIndex(Date.now());
    if(!state.pokemon || state.pokemon.weekKey !== wk){
      var prevIdx = state.pokemon ? state.pokemon.lineIndex : -1;
      var idx = Math.floor(Math.random() * STARTER_LINES.length);
      if(STARTER_LINES.length > 1){
        while(idx === prevIdx){ idx = Math.floor(Math.random() * STARTER_LINES.length); }
      }
      var hadPrevious = !!state.pokemon;
      state.pokemon = { weekKey: wk, lineIndex: idx, xp: 0 };
      saveState();
      if(hadPrevious) pokemonJustRolled = true;
    }
  }

  function ensureHealth(level){
    var max = maxHealthForLevel(level);
    if(state.pokemon.health == null || !state.pokemon.lastHealthDate){
      state.pokemon.health = max;
      state.pokemon.lastHealthDate = localDateStr(Date.now());
      saveState();
      return;
    }
    var today = localDateStr(Date.now());
    if(state.pokemon.lastHealthDate !== today){
      var daysElapsed = Math.max(1, Math.round((dateFromStr(today) - dateFromStr(state.pokemon.lastHealthDate)) / 86400000));
      state.pokemon.health = Math.min(max, state.pokemon.health + healthRestoreForLevel(level) * daysElapsed);
      state.pokemon.lastHealthDate = today;
      saveState();
    }
  }

  function getPokemonInfo(){
    ensurePokemon();
    var line = STARTER_LINES[state.pokemon.lineIndex];
    var xp = state.pokemon.xp;
    var level = 1;
    while(xpThreshold(level) <= xp && level < 40){ level++; }

    var stageIdx = 0;
    if(level >= EVOLVE_AT_LEVEL[1]) stageIdx = 1;
    if(level >= EVOLVE_AT_LEVEL[2]) stageIdx = 2;

    var curBase = level > 1 ? xpThreshold(level - 1) : 0;
    var nextBase = xpThreshold(level);

    ensureHealth(level);
    var maxHealth = maxHealthForLevel(level);
    var health = Math.max(0, Math.min(maxHealth, state.pokemon.health));

    return {
      line: line, stageIdx: stageIdx, stage: line.stages[stageIdx],
      level: level, xp: xp, curBase: curBase, nextBase: nextBase,
      health: health, maxHealth: maxHealth
    };
  }

  function addPokemonXp(amount){
    ensurePokemon();
    var before = getPokemonInfo();
    state.pokemon.xp += amount;
    saveState();
    var after = getPokemonInfo();
    if(after.stageIdx > before.stageIdx){
      showToast('✨ ' + before.stage.name + ' evolved into ' + after.stage.name + '!');
    } else {
      showToast('+' + amount + ' XP for ' + after.stage.name);
    }
  }

  // Bad-habit logging damages HP instead of granting XP.
  function damagePokemonHealth(amount, label){
    var info = getPokemonInfo(); // ensures health is initialized/regenerated first
    state.pokemon.health = Math.max(0, info.health - amount);
    saveState();
    if(state.pokemon.health <= 0){
      showToast('💢 -' + amount + ' HP from ' + label + '. ' + info.stage.name + ' has fainted!');
    } else {
      showToast('💢 -' + amount + ' HP from ' + label);
    }
  }

  var toastTimer = null;
  function showToast(message){
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  /* ---------------- date helpers ---------------- */
  function localDateStr(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dateFromStr(s){
    var parts = s.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function streakInfo(entries){
    if(!entries.length) return { type:'none' };
    var dateSet = {};
    entries.forEach(function(e){ dateSet[localDateStr(e.ts)] = true; });
    var dates = Object.keys(dateSet).sort().reverse();
    var today = localDateStr(Date.now());
    var yesterday = localDateStr(Date.now() - 86400000);
    var mostRecent = dates[0];

    if(mostRecent !== today && mostRecent !== yesterday){
      var daysAgo = Math.round((dateFromStr(today) - dateFromStr(mostRecent)) / 86400000);
      return { type:'stale', daysAgo: daysAgo };
    }

    var streak = 1;
    var cur = dateFromStr(mostRecent);
    for(var i=1; i<dates.length; i++){
      cur.setDate(cur.getDate() - 1);
      var expected = localDateStr(cur.getTime());
      if(dates[i] === expected){ streak++; } else { break; }
    }
    return { type:'active', streak: streak };
  }

  /* ---------------- Frequency (recurring habits) ---------------- */
  function parseFrequencyFromName(rawName){
    var trimmed = (rawName || '').trim();
    var m = trimmed.match(/^(.*\S)\s*[-–,]?\s*(\d+)\s*(days|day|weeks|week|wks|wk|d|w)\s*$/i);
    if(!m) return { name: trimmed, freq: null };
    var cleanName = m[1].trim();
    var n = parseInt(m[2], 10);
    if(!cleanName || !n) return { name: trimmed, freq: null };
    var unit = m[3].toLowerCase().charAt(0) === 'w' ? 'w' : 'd';
    return { name: cleanName, freq: { n: n, unit: unit } };
  }

  function parseFrequencyString(val){
    var m = (val || '').trim().match(/^(\d+)\s*(days|day|weeks|week|wks|wk|d|w)$/i);
    if(!m) return null;
    var n = parseInt(m[1], 10);
    if(!n) return null;
    var unit = m[2].toLowerCase().charAt(0) === 'w' ? 'w' : 'd';
    return { n: n, unit: unit };
  }

  function fmtFreq(freq){
    if(!freq) return '';
    if(freq.unit === 'w') return 'every ' + freq.n + (freq.n === 1 ? ' week' : ' weeks');
    return 'every ' + freq.n + (freq.n === 1 ? ' day' : ' days');
  }

  function freqRequiredDays(freq){ return freq.unit === 'w' ? freq.n * 7 : freq.n; }

  function daysSinceLastLog(entries){
    if(!entries.length) return Infinity;
    var mostRecentTs = entries.reduce(function(max, e){ return Math.max(max, e.ts); }, 0);
    var today = localDateStr(Date.now());
    var lastDay = localDateStr(mostRecentTs);
    return Math.round((dateFromStr(today) - dateFromStr(lastDay)) / 86400000);
  }

  function isTypeDue(catId, type){
    if(!type.freq) return false;
    var days = daysSinceLastLog(entriesFor(catId, type.id));
    return days >= freqRequiredDays(type.freq);
  }

  /* ---------------- 14-day activity heatmap (GitHub-contributions style) ---------------- */
  var HEAT_GOOD = ['rgba(255,255,255,0.06)', '#2f5c52', '#3f7d6e', '#4fa8a0', '#7fd8cc'];
  var HEAT_BAD  = ['rgba(255,255,255,0.06)', '#5c2f2c', '#7d3f3a', '#d9695a', '#f28f82'];

  function heatLevel(mins){
    if(mins <= 0) return 0;
    if(mins < 15) return 1;
    if(mins < 30) return 2;
    if(mins < 60) return 3;
    return 4;
  }

  function heatmapCells(catId, typeId){
    var minutesByDate = {};
    entriesFor(catId, typeId).forEach(function(e){
      var d = localDateStr(e.ts);
      minutesByDate[d] = (minutesByDate[d] || 0) + e.minutes;
    });
    var cells = [];
    for(var i = 13; i >= 0; i--){
      var d = localDateStr(Date.now() - i * 86400000);
      cells.push(minutesByDate[d] || 0);
      if (i > 0 && new Date(d).getDay() === 0){ cells.push(-1); }
    }
    return cells;
  }

  function heatmapHtml(catId, typeId, isBad, large){
    var palette = isBad ? HEAT_BAD : HEAT_GOOD;
    var cells = heatmapCells(catId, typeId);
    return '<div class="heatmap'+(large?' large':'')+'">' + cells.map(function(mins){
      var color = palette[heatLevel(mins)];
      if (mins < 0) return '<span class="heatmap-divider"></span>';
      return '<span class="heatmap-cell" style="background:'+color+'" title="'+mins+'m"></span>';
    }).join('') + '</div>';
  }

  /* ---------------- Journal ---------------- */
  // state.journal: { 'YYYY-MM-DD': { text, words, tierAwarded, ts } }
  var JOURNAL_TIERS = [
    { words: 100, xp: 50 },
    { words: 250, xp: 150 },
    { words: 500, xp: 350 }
  ];
  var JOURNAL_HEAT = ['rgba(44,36,22,0.08)', '#d9b98a', '#c08f4e', '#96602a', '#6b3e12'];
  var journalSaveDebounce = null;

  function countWords(text){
    var trimmed = (text || '').trim();
    if(!trimmed) return 0;
    return trimmed.split(/\s+/).length;
  }

  function journalXpForWords(words){
    var xp = 0;
    JOURNAL_TIERS.forEach(function(t){ if(words >= t.words) xp = t.xp; });
    return xp;
  }

  function journalTierNote(words){
    for(var i=0; i<JOURNAL_TIERS.length; i++){
      if(words < JOURNAL_TIERS[i].words){
        return (JOURNAL_TIERS[i].words - words) + ' words to next milestone (' + JOURNAL_TIERS[i].words + ')';
      }
    }
    return 'All milestones reached today ✨';
  }

  function journalEntries(){
    if(!state.journal) return [];
    return Object.keys(state.journal).filter(function(d){ return state.journal[d].words > 0; })
      .map(function(d){ return { ts: dateFromStr(d).getTime() + 43200000 }; });
  }

  function journalStreakInfo(){ return streakInfo(journalEntries()); }

  function journalHeatLevel(words){
    if(words <= 0) return 0;
    if(words < 100) return 1;
    if(words < 250) return 2;
    if(words < 500) return 3;
    return 4;
  }

  function journalHeatmapCells(){
    var cells = [];
    for(var i = 13; i >= 0; i--){
      var d = localDateStr(Date.now() - i * 86400000);
      var words = (state.journal && state.journal[d] && state.journal[d].words) || 0;
      cells.push(words);
      if(i > 0 && new Date(d).getDay() === 0){ cells.push(-1); }
    }
    return cells;
  }

  function journalHeatmapHtml(large){
    var cells = journalHeatmapCells();
    return '<div class="heatmap journal-heatmap'+(large?' large':'')+'">' + cells.map(function(w){
      if(w < 0) return '<span class="heatmap-divider"></span>';
      return '<span class="heatmap-cell" style="background:'+JOURNAL_HEAT[journalHeatLevel(w)]+'" title="'+w+' words"></span>';
    }).join('') + '</div>';
  }

  function journalStreakBadgeHtml(){
    var s = journalStreakInfo();
    if(s.type === 'active') return '<span class="journal-streak active">🔥 ' + s.streak + 'd</span>';
    if(s.type === 'stale') return '<span class="journal-streak stale">' + s.daysAgo + 'd since</span>';
    return '<span class="journal-streak none">No entries yet</span>';
  }

  function journalHtml(){
    var today = todayKey();
    if(!state.journal) state.journal = {};
    var entry = state.journal[today] || { text: '', words: 0, tierAwarded: 0 };
    var words = entry.words || 0;

    return '<div class="journal-card">' +
      '<div class="journal-header">' +
        '<span class="journal-title">📓 Journal</span>' +
        journalStreakBadgeHtml() +
        '<button class="journal-history-btn" data-journal-history>History</button>' +
      '</div>' +
      '<textarea class="journal-textarea" data-journal-input rows="6" placeholder="Write about your day…">' + escapeHtml(entry.text) + '</textarea>' +
      '<div class="journal-footer">' +
        '<span class="journal-wordcount" data-journal-wordcount>' + words + ' word' + (words===1?'':'s') + '</span>' +
        '<span class="journal-tier-note">' + journalTierNote(words) + '</span>' +
      '</div>' +
      '<div class="journal-heatmap-wrap">' + journalHeatmapHtml(false) + '</div>' +
    '</div>';
  }

  // Live word-count/XP handling on every keystroke, deliberately WITHOUT a full renderTabs()
  // rebuild — replacing the textarea's innerHTML while the user is typing would steal focus
  // and reset the cursor. Only the small counter/note text inside this widget is patched in
  // place; a full re-render (refreshing streak/heatmap/companion everywhere) happens on blur.
  function journalHandleInput(textarea){
    var today = todayKey();
    if(!state.journal) state.journal = {};
    if(!state.journal[today]) state.journal[today] = { text: '', words: 0, tierAwarded: 0, ts: Date.now() };
    var rec = state.journal[today];
    rec.text = textarea.value;
    rec.words = countWords(textarea.value);
    rec.ts = Date.now();

    clearTimeout(journalSaveDebounce);
    journalSaveDebounce = setTimeout(saveState, 400);

    var newXp = journalXpForWords(rec.words);
    if(newXp > (rec.tierAwarded || 0)){
      var gain = newXp - (rec.tierAwarded || 0);
      rec.tierAwarded = newXp;
      saveState();
      addPokemonXp(gain);
    }

    var card = textarea.closest('.journal-card');
    if(card){
      var wc = card.querySelector('[data-journal-wordcount]');
      if(wc) wc.textContent = rec.words + ' word' + (rec.words===1?'':'s');
      var note = card.querySelector('.journal-tier-note');
      if(note) note.textContent = journalTierNote(rec.words);
    }
  }

  function renderJournalHistoryList(){
    if(!state.journal) state.journal = {};
    var days = Object.keys(state.journal).filter(function(d){ return (state.journal[d].text || '').trim().length > 0; }).sort().reverse();
    if(!days.length) return '<div class="empty-state">No journal entries yet.</div>';
    return '<div class="journal-history-list">' + days.map(function(d){
      var rec = state.journal[d];
      var previewSrc = (rec.text || '').trim().replace(/\s+/g, ' ');
      var preview = previewSrc.slice(0, 80);
      var dLabel = dateFromStr(d).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      return '<button class="journal-history-item" data-journal-view="'+d+'">' +
        '<span class="journal-history-date">'+dLabel+'</span>' +
        '<span class="journal-history-preview">'+escapeHtml(preview)+(previewSrc.length>80?'…':'')+'</span>' +
        '<span class="journal-history-words">'+(rec.words||0)+'w</span>' +
      '</button>';
    }).join('') + '</div>';
  }

  function openJournalHistory(){
    document.getElementById('journalModalContent').innerHTML = '<h2>Journal history</h2>' + renderJournalHistoryList();
    document.getElementById('journalModal').classList.remove('hidden');
  }

  function viewJournalEntry(dateKey){
    var rec = state.journal && state.journal[dateKey];
    if(!rec){ openJournalHistory(); return; }
    var dLabel = dateFromStr(dateKey).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('journalModalContent').innerHTML =
      '<button class="chip-freq-btn" data-journal-back style="margin-bottom:10px;">← Back</button>' +
      '<h2 style="margin-top:0;">' + dLabel + '</h2>' +
      '<div class="journal-entry-full">' + escapeHtml(rec.text || '') + '</div>' +
      '<div class="journal-entry-meta">' + (rec.words||0) + ' words</div>';
  }

  /* ---------------- Reminders ---------------- */
  // state.reminders: [{ id, text, dueTs (ms|null), allDay, repeat:{n,unit}|null,
  //                      priority (0/1/2), done, completedDates:{'YYYY-MM-DD':true}, createdTs }]
  // dueTs === null means "inbox" (no date resolved yet). Repeating reminders use dueTs as the
  // anchor date/time and completedDates to track which occurrences were checked off.
  function ensureReminders(){
    if(!state.reminders) state.reminders = [];
    return state.reminders;
  }

  var reminderViewMode = 'day';   // 'day' | 'week', for the Upcoming widget
  var reminderDayIndex = 0;       // which day-page the Upcoming widget's slider is showing
  var reminderEditingId = null;   // id currently open in the detail modal, or null for "new"
  var REMINDER_DAY_SPAN = 14;

  var REMINDER_WEEKDAY_RE = /\b(?:on\s+)?(today|tomorrow|mon(?:day)?|tues?(?:day)?|wed(?:nesday)?|thur?s?(?:day)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b/i;
  var REMINDER_WEEKDAY_INDEX = { sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6 };

  // Parses shorthand like "Call mom 1pm thu !!" or "Water plants every 3d" into
  // { text, dueTs, allDay, repeat, priority }. Unrecognized trailing/leading tokens are left
  // in `text`; if no date/time token is found at all, dueTs stays null (an "inbox" item).
  function parseReminderShorthand(raw){
    var s = ' ' + (raw || '').trim().replace(/\s+/g, ' ') + ' ';
    var priority = 0, repeat = null, dueTs = null, allDay = false;

    if(/\s!!\s/.test(s)){ priority = 2; s = s.replace(/\s!!\s/, ' '); }
    else if(/\s!\s/.test(s)){ priority = 1; s = s.replace(/\s!\s/, ' '); }

    var repM = s.match(/\bevery\s+(\d+)?\s*(days?|d|weeks?|wks?|w)\b/i);
    if(repM){
      var n = parseInt(repM[1], 10) || 1;
      repeat = { n: n, unit: /^w/i.test(repM[2]) ? 'w' : 'd' };
      s = s.replace(repM[0], ' ');
    } else if(/\bdaily\b/i.test(s)){
      repeat = { n: 1, unit: 'd' };
      s = s.replace(/\bdaily\b/i, ' ');
    } else if(/\bweekly\b/i.test(s)){
      repeat = { n: 1, unit: 'w' };
      s = s.replace(/\bweekly\b/i, ' ');
    }

    var relM = s.match(/\bin\s+(\d+)\s*(minutes?|mins?|m|hours?|hrs?|h)\b/i);
    if(relM){
      var amount = parseInt(relM[1], 10);
      dueTs = Date.now() + amount * (/^h/i.test(relM[2]) ? 3600000 : 60000);
      allDay = false;
      s = s.replace(relM[0], ' ');
    } else {
      var dayBaseTs = null, isWeekdayName = false;
      var dayM = s.match(REMINDER_WEEKDAY_RE);
      if(dayM){
        var tok = dayM[1].toLowerCase();
        var base = new Date(); base.setHours(0,0,0,0);
        if(tok === 'tomorrow'){ base.setDate(base.getDate() + 1); }
        else if(tok !== 'today'){
          isWeekdayName = true;
          var targetDow = REMINDER_WEEKDAY_INDEX[tok.slice(0,3)];
          base.setDate(base.getDate() + ((targetDow - base.getDay() + 7) % 7));
        }
        dayBaseTs = base.getTime();
        s = s.replace(dayM[0], ' ');
      }

      var timeM = s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i) || s.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
      var hour = null, minute = 0;
      if(timeM){
        if(timeM[3]){
          hour = parseInt(timeM[1], 10) % 12;
          minute = timeM[2] ? parseInt(timeM[2], 10) : 0;
          if(/pm/i.test(timeM[3])) hour += 12;
        } else {
          hour = parseInt(timeM[1], 10);
          minute = parseInt(timeM[2], 10);
        }
        s = s.replace(timeM[0], ' ');
      }

      if(hour != null){
        var d = new Date(dayBaseTs != null ? dayBaseTs : Date.now());
        if(dayBaseTs == null) d.setHours(0,0,0,0);
        d.setHours(hour, minute, 0, 0);
        dueTs = d.getTime();
        allDay = false;
        if(dueTs <= Date.now()){
          if(dayBaseTs == null) dueTs += 86400000;
          else if(isWeekdayName) dueTs += 7*86400000;
        }
      } else if(dayBaseTs != null){
        dueTs = dayBaseTs;
        allDay = true;
      }
    }

    if(repeat && dueTs == null){
      var anchor = new Date(); anchor.setHours(9,0,0,0);
      dueTs = anchor.getTime();
      allDay = true;
    }

    return { text: s.replace(/\s+/g, ' ').trim(), dueTs: dueTs, allDay: allDay, repeat: repeat, priority: priority };
  }

  function findReminder(id){ return ensureReminders().find(function(r){ return r.id === id; }); }

  function addReminder(fields){
    var rem = {
      id: uid('rem'),
      text: fields.text || 'Reminder',
      dueTs: fields.dueTs != null ? fields.dueTs : null,
      allDay: !!fields.allDay,
      repeat: fields.repeat || null,
      priority: fields.priority || 0,
      done: false,
      completedDates: {},
      createdTs: Date.now()
    };
    ensureReminders().push(rem);
    saveState();
    return rem;
  }

  function updateReminder(id, fields){
    var rem = findReminder(id);
    if(!rem) return;
    rem.text = fields.text || 'Reminder';
    rem.dueTs = fields.dueTs != null ? fields.dueTs : null;
    rem.allDay = !!fields.allDay;
    rem.repeat = fields.repeat || null;
    rem.priority = fields.priority || 0;
    saveState();
  }

  function deleteReminder(id){
    state.reminders = ensureReminders().filter(function(r){ return r.id !== id; });
    saveState();
  }

  // Whether a (possibly repeating) reminder has an occurrence on the given YYYY-MM-DD.
  function reminderOccursOn(rem, dateStr){
    if(rem.dueTs == null) return false;
    var anchorStr = localDateStr(rem.dueTs);
    if(!rem.repeat) return anchorStr === dateStr;
    var anchorDate = dateFromStr(anchorStr), targetDate = dateFromStr(dateStr);
    if(targetDate < anchorDate) return false;
    var diffDays = Math.round((targetDate - anchorDate) / 86400000);
    var intervalDays = rem.repeat.unit === 'w' ? rem.repeat.n * 7 : rem.repeat.n;
    return intervalDays > 0 && diffDays % intervalDays === 0;
  }

  function isReminderDoneOn(rem, dateStr){
    if(rem.repeat) return !!(rem.completedDates && rem.completedDates[dateStr]);
    return !!rem.done;
  }

  function toggleReminderDone(remId, dateStr){
    var rem = findReminder(remId);
    if(!rem) return;
    if(rem.repeat){
      if(!rem.completedDates) rem.completedDates = {};
      rem.completedDates[dateStr] = !rem.completedDates[dateStr];
    } else {
      rem.done = !rem.done;
    }
    saveState();
  }

  function remindersForDate(dateStr){
    return ensureReminders().filter(function(r){ return reminderOccursOn(r, dateStr); }).sort(function(a,b){
      var ta = a.allDay ? -1 : (new Date(a.dueTs).getHours()*60 + new Date(a.dueTs).getMinutes());
      var tb = b.allDay ? -1 : (new Date(b.dueTs).getHours()*60 + new Date(b.dueTs).getMinutes());
      if(ta !== tb) return ta - tb;
      return b.priority - a.priority;
    });
  }

  function unscheduledReminders(){
    return ensureReminders().filter(function(r){ return r.dueTs == null && !r.done; });
  }

  function overdueReminders(){
    var today = todayKey();
    return ensureReminders().filter(function(r){
      if(r.dueTs == null || r.repeat || r.done) return false;
      return localDateStr(r.dueTs) < today;
    });
  }

  function priorityMarkHtml(p){
    if(p === 2) return '<span class="reminder-pri reminder-pri-2">‼</span>';
    if(p === 1) return '<span class="reminder-pri reminder-pri-1">!</span>';
    return '';
  }

  function fmtReminderWhen(rem){
    if(rem.dueTs == null) return 'No date';
    var d = new Date(rem.dueTs);
    var dateStr = localDateStr(rem.dueTs), todayStr = todayKey();
    var label;
    if(dateStr === todayStr) label = 'Today';
    else if(dateStr === localDateStr(Date.now() + 86400000)) label = 'Tomorrow';
    else label = d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
    if(!rem.allDay) label += ', ' + d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    if(rem.repeat) label += ' · ' + fmtFreq(rem.repeat);
    return label;
  }

  function reminderRowHtml(rem, dateStr, showWhen){
    var effDate = dateStr || (rem.dueTs != null ? localDateStr(rem.dueTs) : '');
    var done = isReminderDoneOn(rem, effDate);
    var timeLabel = (!rem.allDay && rem.dueTs != null) ? new Date(rem.dueTs).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) : '';
    return '<div class="reminder-row' + (done?' done':'') + '">' +
      '<button class="reminder-check' + (done?' done':'') + '" data-reminder-toggle="' + rem.id + '|' + effDate + '">' + (done?'✓':'') + '</button>' +
      '<div class="reminder-row-main" data-reminder-edit="' + rem.id + '">' +
        '<div class="reminder-row-top">' + priorityMarkHtml(rem.priority) +
          '<span class="reminder-row-text">' + escapeHtml(rem.text || '(untitled)') + '</span>' +
          (showWhen ? '<span class="reminder-row-when">' + escapeHtml(fmtReminderWhen(rem)) + '</span>'
                    : (timeLabel ? '<span class="reminder-row-when">' + timeLabel + '</span>' : (rem.repeat ? '<span class="reminder-row-when">' + fmtFreq(rem.repeat) + '</span>' : ''))) +
        '</div>' +
      '</div>' +
      '<button class="reminder-del" data-reminder-delete="' + rem.id + '" title="Delete">&times;</button>' +
    '</div>';
  }

  function reminderAddHtml(){
    ensureReminders();
    var overdue = overdueReminders();
    var unscheduled = unscheduledReminders();

    var sectionsHtml = '';
    if(overdue.length){
      sectionsHtml += '<div class="reminder-sub-label">Overdue</div>' +
        overdue.map(function(r){ return reminderRowHtml(r, localDateStr(r.dueTs), true); }).join('');
    }
    if(unscheduled.length){
      sectionsHtml += '<div class="reminder-sub-label">Inbox</div>' +
        unscheduled.map(function(r){ return reminderRowHtml(r, '', false); }).join('');
    }
    if(!sectionsHtml){
      sectionsHtml = '<div class="reminder-empty">Nothing overdue or unscheduled 🎉</div>';
    }

    return '<div class="reminder-card">' +
      '<div class="reminder-add-header"><span class="reminder-add-title">⏰ Reminders</span><button class="reminder-pill-btn" data-reminder-new title="Set exact time &amp; repeat">+ Detail</button></div>' +
      '<div class="reminder-quick-row">' +
        '<input type="text" class="reminder-quick-input" data-reminder-quick-input placeholder="e.g. Call mom 1pm thu !!" maxlength="120">' +
        '<button class="reminder-quick-add-btn" data-reminder-quick-add>Add</button>' +
      '</div>' +
      '<div class="reminder-quick-hint">time · in 40min/2h · day / day+time · every 3d/2w · ! !!</div>' +
      '<div class="reminder-sections">' + sectionsHtml + '</div>' +
    '</div>';
  }

  function reminderDayPageHtml(offset){
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + offset);
    var dateStr = localDateStr(d.getTime());
    var label = offset === 0 ? 'Today' : (offset === 1 ? 'Tomorrow' : d.toLocaleDateString([], { weekday:'long', month:'short', day:'numeric' }));
    var items = remindersForDate(dateStr);
    var body = items.length
      ? items.map(function(r){ return reminderRowHtml(r, dateStr, false); }).join('')
      : '<div class="reminder-empty">Nothing scheduled.</div>';
    return '<div class="reminder-day-page">' +
      '<div class="reminder-day-label">' + escapeHtml(label) + '</div>' +
      body +
    '</div>';
  }

  function reminderWeekOverviewHtml(){
    var rows = '';
    for(var i=0; i<7; i++){
      var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + i);
      var dateStr = localDateStr(d.getTime());
      var label = i === 0 ? 'Today' : d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
      var items = remindersForDate(dateStr);
      rows += '<div class="reminder-week-row">' +
        '<div class="reminder-week-date">' + escapeHtml(label) + '</div>' +
        '<div class="reminder-week-items">' +
          (items.length ? items.map(function(r){
            var t = (!r.allDay && r.dueTs != null) ? new Date(r.dueTs).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) + ' ' : '';
            return '<span class="reminder-week-chip" data-reminder-edit="' + r.id + '">' + priorityMarkHtml(r.priority) + escapeHtml(t + (r.text || '(untitled)')) + '</span>';
          }).join('') : '<span class="reminder-week-empty">—</span>') +
        '</div>' +
      '</div>';
    }
    return '<div class="reminder-week-list">' + rows + '</div>';
  }

  function reminderUpcomingHtml(){
    ensureReminders();
    var header = '<div class="reminder-upcoming-header">' +
      '<span class="reminder-add-title">📆 Upcoming</span>' +
      (reminderViewMode !== 'week' && reminderDayIndex !== 0 ? '<button class="reminder-pill-btn" data-reminder-today title="Jump to today" style="margin-left:auto;">Today</button>' : '') +
      '<button class="reminder-pill-btn" data-reminder-view-toggle' + (reminderViewMode !== 'week' && reminderDayIndex !== 0 ? '' : ' style="margin-left:auto;"') + '>' + (reminderViewMode === 'week' ? 'Day view' : 'Week overview') + '</button>' +
    '</div>';

    if(reminderViewMode === 'week'){
      return '<div class="reminder-card">' + header + reminderWeekOverviewHtml() + '</div>';
    }

    var pages = '';
    for(var i=0; i<REMINDER_DAY_SPAN; i++){ pages += reminderDayPageHtml(i); }
    return '<div class="reminder-card">' + header +
      '<div class="reminder-day-scroller" id="reminderDayScroller">' + pages + '</div>' +
    '</div>';
  }

  function wireReminderDayScroller(){
    var el = document.getElementById('reminderDayScroller');
    if(!el) return;
    el.scrollLeft = reminderDayIndex * el.clientWidth;
    el.addEventListener('scroll', function(){
      clearTimeout(el._remScrollDebounce);
      el._remScrollDebounce = setTimeout(function(){
        var idx = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
        if(idx >= 0 && idx < REMINDER_DAY_SPAN) reminderDayIndex = idx;
      }, 80);
    });
  }

  function submitReminderQuickAdd(){
    var input = document.querySelector('[data-reminder-quick-input]');
    if(!input) return;
    var raw = input.value.trim();
    if(!raw) return;
    var parsed = parseReminderShorthand(raw);
    addReminder(parsed);
    renderTabs();
    showToast(parsed.dueTs ? 'Reminder set for ' + fmtReminderWhen(parsed) : 'Reminder added to inbox');
