<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — Habit &amp; Work Tracker</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12151a">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#12151a;
    --surface:#1b2027;
    --surface-2:#232a33;
    --surface-3:#2b333f;
    --cream:#f1e8d6;
    --cream-dim:#dccfab;
    --ink:#241f16;
    --text:#ece8e0;
    --text-dim:#9aa3ad;
    --text-faint:#5c6572;
    --accent:#e8a33d;
    --accent-dim:#7a5a26;
    --accent2:#4fa8a0;
    --danger:#d9695a;
    --line:#2f3742;
    --xp:#9bb6e9;
    --xp2:#1c53b9;
    --font-display:'Space Grotesk', 'Arial Black', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius:14px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(232,163,61,0.07), transparent 45%),
      radial-gradient(circle at 90% 30%, rgba(79,168,160,0.06), transparent 40%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:40px;
  }

  #app{
    max-width:480px;
    margin:0 auto;
    padding:0 16px 24px;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:22px 2px 18px;
    position:sticky;
    top:0;
    background:linear-gradient(var(--bg) 80%, transparent);
    z-index:5;
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
  }
  .stamp-mark{
    width:34px; height:34px;
    border-radius:50%;
    border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:13px;
    flex-shrink:0;
    transform:rotate(-8deg);
  }
  .topbar h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    margin:0;
    flex:1;
  }
  .topbar h1 span{ color:var(--accent);  }
  .icon-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    width:40px; height:40px;
    border-radius:10px;
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{ background:var(--surface-3); }

  /* ---------- Category cards ---------- */
  /* ---------- Tamagotchi companion ---------- */
  .tama-card{
    background:var(--cream);
    border-radius:20px;
    padding:12px;
    display:flex;
    gap:14px;
    align-items:stretch;
    margin-bottom:18px;
    position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 6px 16px rgba(0,0,0,0.25);
  }
  .tama-card::before, .tama-card::after,
  .tama-screws span{ }
  .tama-screws{
    position:absolute; inset:6px;
    pointer-events:none;
  }
  .tama-screws span{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--cream-dim);
    box-shadow:inset 0 1px 1px rgba(0,0,0,0.35);
  }
  .tama-screws span:nth-child(1){ top:0; left:0; }
  .tama-screws span:nth-child(2){ top:0; right:0; }
  .tama-screws span:nth-child(3){ bottom:0; left:0; }
  .tama-screws span:nth-child(4){ bottom:0; right:0; }

  .tama-screen{
    width:104px;
    height:104px;
    flex-shrink:0;
    border-radius:14px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 35% 25%, #1c2a28, var(--bg) 75%);
    border:3px solid var(--ink);
    box-shadow:inset 0 0 0 2px rgba(232,163,61,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .tama-sprite{
    /* width:100px; */
    /* height:100px; */
    width:80px;
    /* height:100px; */
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    /* animation:tamaBob 2.4s ease-in-out infinite; */
    filter:drop-shadow(0 3px 2px rgba(0,0,0,0.4));
  }
  @keyframes tamaBob{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  .tama-lvl-badge{
    position:absolute;
    top:5px; left:5px;
    background:rgba(0,0,0,0.55);
    color:var(--xp);
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:6px;
    letter-spacing:0.5px;
    z-index:1;
  }

  .tama-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    color:var(--ink);
  }
  .tama-name-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .tama-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
  }
  .tama-caption{
    font-size:11px;
    color:#6b6250;
  }
  .tama-pips{
    display:flex;
    gap:4px;
    margin-left:auto;
  }
  .tama-pips span{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--xp2);
    border:1px solid var(--xp);
  }
  .tama-pips span.filled{ background:var(--xp); border-color:var(--xp2); }

  .xp-track{
    height:9px;
    background:rgba(36,31,22,0.15);
    border-radius:5px;
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    background:linear-gradient(90deg, var(--xp), var(--xp2));
    border-radius:5px;
    transition:width 0.5s ease;
    width:0%;
  }
  .xp-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    color: --var(--ink);
  }

  /* ---------- HP bar ---------- */
  .hp-row{ display:flex; align-items:center; gap:6px; }
  .hp-track{
    flex:1;
    height:8px;
    background:rgba(36,31,22,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .hp-fill{
    height:100%;
    background:linear-gradient(90deg, #8bbf5a, #4f9c4a);
    border-radius:4px;
    transition:width 0.5s ease, background 0.3s ease;
    width:100%;
  }
  .hp-fill.low{ background:linear-gradient(90deg, #e8c33d, #c98f2a); }
  .hp-fill.critical{ background:linear-gradient(90deg, #e8746a, #b23c2c); }
  .hp-label{
    font-family:var(--font-mono);
    font-size:9.5px;
    color:var(--ink);
    white-space:nowrap;
    flex-shrink:0;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 12px);
    background:var(--ink);
    color:var(--cream);
    font-size:13px;
    font-weight:600;
    padding:11px 18px;
    border-radius:30px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    z-index:80;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    max-width:88%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  .category-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }

  /* ---------- Daily 3 things ---------- */
  .daily-todo-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .daily-todo-header{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .daily-todo-title{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .daily-todo-date{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); margin-left:auto; }
  .daily-todo-list{ display:flex; flex-direction:column; gap:8px; }
  .daily-todo-row{ display:flex; align-items:center; gap:8px; }
  .daily-todo-check{
    width:24px; height:24px; flex-shrink:0;
    border-radius:7px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--accent2); font-size:13px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .daily-todo-check.done{ background:var(--accent2); color:#0c2320; border-color:var(--accent2); }
  .daily-todo-input{
    flex:1; min-width:0;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:8px; font-size:13.5px; font-family:var(--font-body);
  }
  .daily-todo-row.done .daily-todo-input{ color:var(--text-faint); text-decoration:line-through; }

  /* ---------- Sleep tracker ---------- */
  .sleep-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .sleep-header{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .sleep-title{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .sleep-header .chip-freq-btn{ margin-left:auto; font-size:12px; }
  .sleep-empty{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); line-height:1.5; }
  .sleep-times{ display:flex; gap:22px; }
  .sleep-stat{ display:flex; flex-direction:column; gap:2px; }
  .sleep-stat-label{
    font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--text-faint);
  }
  .sleep-stat-value{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .sleep-note{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-top:8px; }

  .category-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 14px;
    position:relative;
    overflow:hidden;
  }
  .category-card::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--cat-color, var(--accent2));
  }

  .cat-header{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cat-icon{ font-size:20px; width:26px; text-align:center; flex-shrink:0; }
  .cat-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cat-meta{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; }

  .streak-stamp{
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .streak-stamp.active{ color:var(--accent); border:1px solid var(--accent-dim); background:rgba(232,163,61,0.08); }
  .streak-stamp.stale{ color:var(--text-faint); border:1px solid var(--line); }
  .streak-stamp.none{ color:var(--text-faint); border:1px solid var(--line); }

  .week-total{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--accent2);
  }

  .type-select{
    width:100%;
    margin-top:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    padding:11px 12px;
    border-radius:10px;
    appearance:none;
  }

  .type-detail{
    margin-top:12px;
    background:var(--surface-2);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:12px;
  }
  .type-detail[hidden]{ display:none; }

  .type-overview{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .type-overview .t-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
  }
  .type-overview .t-info{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
  }

  .log-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .step-btn{
    width:38px; height:38px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--surface-3);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:700;
    flex-shrink:0;
    cursor:pointer;
  }
  .step-btn:active{ background:var(--accent-dim); }
  .minutes-input{
    flex:1;
    min-width:0;
    text-align:center;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--accent);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:16px;
    padding:9px 4px;
    border-radius:9px;
  }
  .minutes-input::-webkit-outer-spin-button,
  .minutes-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .log-btn{
    background:var(--accent);
    color:#211505;
    border:none;
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    padding:0 16px;
    height:38px;
    border-radius:9px;
    cursor:pointer;
    flex-shrink:0;
  }
  .log-btn:active{ filter:brightness(0.9); }
  .log-confirm{
    margin-top:8px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--accent2);
    display:none;
  }

  .add-type-form{ display:flex; gap:8px; margin-top:10px; }
  .add-type-form input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:9px;
    font-size:14px;
  }
  .add-type-form button{
    background:var(--accent2);
    color:#0c2320;
    border:none;
    font-weight:700;
    padding:0 14px;
    border-radius:9px;
    font-size:13px;
    cursor:pointer;
  }

  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:30px 10px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    font-size:14px;
  }

  /* ---------- Compact activity list ---------- */
  .type-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .type-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
  }
  .type-check{
    width:24px; height:24px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--accent2);
    font-size:13px;
    font-weight:700;
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .type-check.done{ background:var(--accent2); color:#0c2320; border-color:var(--accent2); }
  .type-row-main{ flex:1; min-width:0; cursor:pointer; }
  .type-row-top{ display:flex; align-items:center; gap:5px; }
  .type-row-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:13.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .type-row-since{
    margin-left:auto;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-dim);
    flex-shrink:0;
    white-space:nowrap;
    padding-left:6px;
  }
  .type-row-chevron{ color:var(--text-faint); font-size:14px; flex-shrink:0; }

  .heatmap{ display:flex; gap:2px; margin-top:6px; }
  .heatmap-cell{ width:7px; height:9px; border-radius:2px; flex-shrink:0; }
  .heatmap.large{ gap:3px; margin-top:8px; }
  .heatmap.large .heatmap-cell{ width:16px; height:16px; border-radius:3px; }
  .heatmap-divider { width:1px; height:9px; background:var(--accent-dim); border-radius:1px; flex-shrink:0; }

  .add-type-row{
    background:none;
    border:1px dashed var(--line);
    color:var(--accent2);
    border-radius:10px;
    padding:10px;
    font-size:13px;
    font-weight:700;
    font-family:var(--font-body);
    cursor:pointer;
    width:100%;
  }

  /* ---------- Detail popup ---------- */
  .detail-header{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .detail-cat-icon{ font-size:28px; flex-shrink:0; }
  .detail-title{ font-family:var(--font-display); font-weight:700; font-size:18px; display:flex; align-items:center; }
  .detail-title .candy-icon{ width:18px; height:18px; }
  .detail-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:3px; }
  .detail-stats{ display:flex; gap:20px; margin-bottom:6px; }
  .detail-stat{ display:flex; flex-direction:column; gap:2px; }
  .detail-stat-label{
    font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--text-faint);
  }
  .detail-stat-value{ font-family:var(--font-display); font-weight:700; font-size:14px; }
  .detail-heatmap-label{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); margin-top:10px; }
  .detail-check-btn{ margin-top:18px; }
  .detail-check-btn:disabled{ opacity:0.6; cursor:default; }

  /* ---------- Due items (frequency reminders) ---------- */
  .due-section{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .due-item{
    background:rgba(232,163,61,0.08);
    border:1px solid var(--accent-dim);
    border-radius:10px;
    padding:10px;
  }
  .due-item-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .due-badge{
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:700;
    letter-spacing:0.5px;
    color:var(--accent);
    background:rgba(232,163,61,0.15);
    padding:2px 7px;
    border-radius:12px;
    flex-shrink:0;
  }
  .due-name{ font-family:var(--font-display); font-weight:700; font-size:13.5px; }
  .due-sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin:4px 0 8px;
  }

  /* ---------- XP/HP multiplier candy ---------- */
  .candy-icon{
    width:14px; height:14px;
    vertical-align:-2px;
    margin-right:3px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  .mult-note{
    font-family:var(--font-mono);

  }

    background:none; border:none; color:var(--accent); font-size:11px; font-family:var(--font-mono);

  }

    font-size:9.5px;
    font-family:var(--font-mono);

    padding:1px 6px;
    border-radius:10px;
    margin-left:5px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .freq-badge{
    font-size:10px;
    font-family:var(--font-mono);
    color:var(--accent2);
    border:1px solid var(--accent2);
    padding:1px 6px;
    border-radius:10px;
    margin-left:4px;
  }
  .chip-freq-btn{
    background:none; border:none; color:var(--accent2); font-size:13px; cursor:pointer; line-height:1;
    padding:0 2px;
  }
  .checkbox-row{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--text-dim);
    margin-top:12px;
    text-transform:none;
    letter-spacing:normal;
  }
  .new-cat-form input[type="checkbox"]{ width:auto; margin:0; }

  /* ---------- Timer popup ---------- */

    height:120px;
    border-radius:14px;
    background:

      radial-gradient(circle at 35% 25%, #1c2a28, var(--bg) 75%);
    border:3px solid var(--ink);
    box-shadow:inset 0 0 0 2px rgba(232,163,61,0.25);
    overflow:hidden;
    margin-bottom:16px;
  }
  .timer-sprite{
    position:absolute;
    bottom:12px;
    left:0px;
    width:64px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,0.4));
    animation: tamaBob 1s ease-in-out infinite;
  }
  .timer-readout{
    font-family:var(--font-mono);
    font-size:36px;
    font-weight:700;
    color:var(--accent);
    margin-bottom:6px;
    letter-spacing:1px;
  }
  .timer-sub{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:16px;
  }

  }

    background:var(--cream);

    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;

  .log-item .li-title{ font-weight:600; font-size:13.5px; }

    color:var(--cream);

    border-radius:6px;

  .modal-overlay{

    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }

  .modal-card{

  }

    padding:12px;
    margin-bottom:12px;
    background:var(--surface-2);

  }
  .manage-cat-head strong{ font-family:var(--font-display); font-size:14px; flex:1; }
  .mini-danger{
    background:none; border:1px solid var(--danger); color:var(--danger);

  }
  .type-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .type-chip{

  }

    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:6px;
  }
  .new-cat-form label{

    text-transform:uppercase; letter-spacing:0.5px;

    for(var i=0; i<MULTIPLIER_TIERS.length; i++){ if(MULTIPLIER_TIERS[i].key === key) return MULTIPLIER_TIERS[i]; }
    return MULTIPLIER_TIERS[0];
  }
  function cycleMultiplierTier(type){
    var cur = (type.multiplierTier) || 'xs';
    var idx = MULTIPLIER_ORDER.indexOf(cur);
    type.multiplierTier = MULTIPLIER_ORDER[(idx + 1) % MULTIPLIER_ORDER.length];
  }

  // Single place that actually records a log entry and applies its XP/HP effect (scaled by
  // the activity's candy multiplier). Used by the manual log button, the auto-surfaced due
  // items, and the timer popup, so all three stay in sync.
  function commitLog(catId, typeId, mins){
    var cat = findCat(catId);
    var type = cat && findType(cat, typeId);
    if(!cat || !type || !mins || mins <= 0) return;

    state.logs.push({ id: uid('log'), catId: catId, typeId: typeId, minutes: mins, ts: Date.now() });
    saveState();

    var tier = getMultiplierTier(type);
    if(cat.isBad){
      // Bad habits (e.g. doomscrolling) damage the companion's HP instead of granting XP.
      damagePokemonHealth(Math.round(mins * BAD_HEALTH_PER_MINUTE * tier.mult), type.name);
    } else {
      // Award companion XP: 10 XP/minute (15 min = 150 XP), plus a bonus for an active streak,
      // then scaled by the activity's own XP multiplier tier.
      var postStreak = streakInfo(entriesFor(catId, typeId));
      var xpGain = mins * XP_PER_MINUTE;
      if(postStreak.type === 'active' && postStreak.streak >= 2){
        xpGain += Math.min(postStreak.streak, STREAK_BONUS_CAP_DAYS) * STREAK_BONUS_PER_DAY;
      }
      addPokemonXp(Math.round(xpGain * tier.mult));
    }

    renderCategories();
    renderLog();
  }

  // Cumulative XP required to REACH level n+1, starting from level 1 at 0 XP.
  function xpThreshold(n){
    var total = 0;
    for(var i=1; i<=n; i++){ total += 100*i + 25*i*(i-1); }
    return total;
  }

  var DEFAULT_STATE = {
    categories: [
      { id:'cat_music', name:'Music', icon:'🎵', color:CAT_COLORS[0],
        types:[ {id:'t_piano', name:'Piano'}, {id:'t_guitar', name:'Guitar'} ] },
      { id:'cat_exercise', name:'Exercise', icon:'🏃', color:CAT_COLORS[1],
        types:[ {id:'t_run', name:'Running'}, {id:'t_gym', name:'Gym'} ] }
    ],
    logs: [] // {id, catId, typeId, minutes, ts}
  };

  var state = loadState();
  var openTypeByCat = {}; // catId -> typeId currently expanded in that card

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      var parsed = JSON.parse(raw);
      if(!parsed.categories) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      return parsed;
    }catch(e){
      console.warn('Could not read saved data, starting fresh.', e);
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.warn('Could not save data (storage may be unavailable/full).', e);
    }
  }

  function uid(prefix){
    return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
  }

  /* ---------------- Companion helpers ---------------- */
  // A simple, DST-safe "week index" (Monday-anchored) used to decide when to roll a new companion.
  function weekIndex(ts){
    var d = new Date(ts);
    var localMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var epochMonday = new Date(1970, 0, 5).getTime(); // Jan 5 1970 was a Monday
    return Math.floor((localMidnight - epochMonday) / (86400000 * 7));
  }

  var pokemonJustRolled = false;

  function ensurePokemon(){
    var wk = weekIndex(Date.now());
    if(!state.pokemon || state.pokemon.weekKey !== wk){
      var prevIdx = state.pokemon ? state.pokemon.lineIndex : -1;
      var idx = Math.floor(Math.random() * STARTER_LINES.length);
      if(STARTER_LINES.length > 1){
        while(idx === prevIdx){ idx = Math.floor(Math.random() * STARTER_LINES.length); }
      }
      var hadPrevious = !!state.pokemon;
      state.pokemon = { weekKey: wk, lineIndex: idx, xp: 0 };
      saveState();
      if(hadPrevious) pokemonJustRolled = true;
    }
  }

  // Restores HP once per elapsed calendar day (catches up if the app wasn't opened for a few days).
  // Also initializes health/lastHealthDate the first time a companion is seen (e.g. right after a reroll).
  function ensureHealth(level){
    var max = maxHealthForLevel(level);
    if(state.pokemon.health == null || !state.pokemon.lastHealthDate){
      state.pokemon.health = max;
      state.pokemon.lastHealthDate = localDateStr(Date.now());
      saveState();
      return;
    }
    var today = localDateStr(Date.now());
    if(state.pokemon.lastHealthDate !== today){
      var daysElapsed = Math.max(1, Math.round((dateFromStr(today) - dateFromStr(state.pokemon.lastHealthDate)) / 86400000));
      state.pokemon.health = Math.min(max, state.pokemon.health + healthRestoreForLevel(level) * daysElapsed);
      state.pokemon.lastHealthDate = today;
      saveState();
    }
  }

  function getPokemonInfo(){
    ensurePokemon();
    var line = STARTER_LINES[state.pokemon.lineIndex];
    var xp = state.pokemon.xp;
    var level = 1;
    while(xpThreshold(level) <= xp && level < 40){ level++; }

    var stageIdx = 0;
    if(level >= EVOLVE_AT_LEVEL[1]) stageIdx = 1;
    if(level >= EVOLVE_AT_LEVEL[2]) stageIdx = 2;

    var curBase = level > 1 ? xpThreshold(level - 1) : 0;
    var nextBase = xpThreshold(level);

    ensureHealth(level);
    var maxHealth = maxHealthForLevel(level);
    var health = Math.max(0, Math.min(maxHealth, state.pokemon.health));

    return {
      line: line, stageIdx: stageIdx, stage: line.stages[stageIdx],
      level: level, xp: xp, curBase: curBase, nextBase: nextBase,
      health: health, maxHealth: maxHealth
    };
  }

  function addPokemonXp(amount){
    ensurePokemon();
    var before = getPokemonInfo();
    state.pokemon.xp += amount;
    saveState();
    var after = getPokemonInfo();
    renderPokemon();
    if(after.stageIdx > before.stageIdx){
      showToast('✨ ' + before.stage.name + ' evolved into ' + after.stage.name + '!');
    } else {
      showToast('+' + amount + ' XP for ' + after.stage.name);
    }
  }

  // Bad-habit logging damages HP instead of granting XP.
  function damagePokemonHealth(amount, label){
    var info = getPokemonInfo(); // ensures health is initialized/regenerated first
    state.pokemon.health = Math.max(0, info.health - amount);
    saveState();
    renderPokemon();
    if(state.pokemon.health <= 0){
      showToast('💢 -' + amount + ' HP from ' + label + '. ' + info.stage.name + ' has fainted!');
    } else {
      showToast('💢 -' + amount + ' HP from ' + label);
    }
  }

  var toastTimer = null;
  function showToast(message){
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  /* ---------------- date helpers ---------------- */
  function localDateStr(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dateFromStr(s){
    var parts = s.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function streakInfo(entries){
    if(!entries.length) return { type:'none' };
    var dateSet = {};
    entries.forEach(function(e){ dateSet[localDateStr(e.ts)] = true; });
    var dates = Object.keys(dateSet).sort().reverse();
    var today = localDateStr(Date.now());
    var yesterday = localDateStr(Date.now() - 86400000);
    var mostRecent = dates[0];

    if(mostRecent !== today && mostRecent !== yesterday){
      var daysAgo = Math.round((dateFromStr(today) - dateFromStr(mostRecent)) / 86400000);
      return { type:'stale', daysAgo: daysAgo };
    }

    var streak = 1;
    var cur = dateFromStr(mostRecent);
    for(var i=1; i<dates.length; i++){
      cur.setDate(cur.getDate() - 1);
      var expected = localDateStr(cur.getTime());
      if(dates[i] === expected){ streak++; } else { break; }
    }
    return { type:'active', streak: streak };
  }

  /* ---------------- Frequency (recurring habits) ---------------- */
  // Auto-detects a trailing shorthand like "2w" or "10 days" in a typed name, e.g.
  // "Wash sheets 2w" -> { name: "Wash sheets", freq: {n:2, unit:'w'} }.
  // Returns freq:null if no recognizable trailing frequency token is present.
  function parseFrequencyFromName(rawName){
    var trimmed = (rawName || '').trim();
    var m = trimmed.match(/^(.*\S)\s*[-–,]?\s*(\d+)\s*(days|day|weeks|week|wks|wk|d|w)\s*$/i);
    if(!m) return { name: trimmed, freq: null };
    var cleanName = m[1].trim();
    var n = parseInt(m[2], 10);
    if(!cleanName || !n) return { name: trimmed, freq: null };
    var unit = m[3].toLowerCase().charAt(0) === 'w' ? 'w' : 'd';
    return { name: cleanName, freq: { n: n, unit: unit } };
  }

  // Parses a standalone frequency string like "2w" or "10 days" (used by the manual editor).
  function parseFrequencyString(val){
    var m = (val || '').trim().match(/^(\d+)\s*(days|day|weeks|week|wks|wk|d|w)$/i);
    if(!m) return null;
    var n = parseInt(m[1], 10);
    if(!n) return null;
    var unit = m[2].toLowerCase().charAt(0) === 'w' ? 'w' : 'd';
    return { n: n, unit: unit };
  }

  function fmtFreq(freq){
    if(!freq) return '';
    if(freq.unit === 'w') return 'every ' + freq.n + (freq.n === 1 ? ' week' : ' weeks');
    return 'every ' + freq.n + (freq.n === 1 ? ' day' : ' days');
  }

  function freqRequiredDays(freq){ return freq.unit === 'w' ? freq.n * 7 : freq.n; }

  // Days since the most recent log for a set of entries. Infinity if never logged.
  function daysSinceLastLog(entries){
    if(!entries.length) return Infinity;
    var mostRecentTs = entries.reduce(function(max, e){ return Math.max(max, e.ts); }, 0);
    var today = localDateStr(Date.now());
    var lastDay = localDateStr(mostRecentTs);
    return Math.round((dateFromStr(today) - dateFromStr(lastDay)) / 86400000);
  }

  function isTypeDue(catId, type){
    if(!type.freq) return false;
    var days = daysSinceLastLog(entriesFor(catId, type.id));
    return days >= freqRequiredDays(type.freq);
  }

  /* ---------------- 14-day activity heatmap (GitHub-contributions style) ---------------- */
  var HEAT_GOOD = ['rgba(255,255,255,0.06)', '#2f5c52', '#3f7d6e', '#4fa8a0', '#7fd8cc'];
  var HEAT_BAD  = ['rgba(255,255,255,0.06)', '#5c2f2c', '#7d3f3a', '#d9695a', '#f28f82'];

  function heatLevel(mins){
    if(mins <= 0) return 0;
    if(mins < 15) return 1;
    if(mins < 30) return 2;
    if(mins < 60) return 3;
    return 4;
  }

  // Oldest-to-newest array of 14 daily totals (minutes) for a given activity.
  function heatmapCells(catId, typeId){
    // Add divider for sunday-monday (each new week)
    var minutesByDate = {};
    entriesFor(catId, typeId).forEach(function(e){
      var d = localDateStr(e.ts);
      minutesByDate[d] = (minutesByDate[d] || 0) + e.minutes;
    });
    var cells = [];
    for(var i = 13; i >= 0; i--){
      var d = localDateStr(Date.now() - i * 86400000);
      cells.push(minutesByDate[d] || 0);
      if (i > 0 && new Date(d).getDay() === 0){ cells.push(-1); }
    }
    return cells;
  }

  function heatmapHtml(catId, typeId, isBad, large){
    var palette = isBad ? HEAT_BAD : HEAT_GOOD;
    var cells = heatmapCells(catId, typeId);
    return '<div class="heatmap'+(large?' large':'')+'">' + cells.map(function(mins){
      var color = palette[heatLevel(mins)];
      if (mins < 0) return '<span class="heatmap-divider"></span>';
      return '<span class="heatmap-cell" style="background:'+color+'" title="'+mins+'m"></span>';
    }).join('') + '</div>';
  }

  /* ---------------- Checklist items (done/not-done instead of a duration) ---------------- */
  var CHECKLIST_MINUTES = 15; // "done" is worth the same as a 15-min log, scaled by the candy multiplier
  function isDoneToday(catId, typeId){
    var today = localDateStr(Date.now());
    return entriesFor(catId, typeId).some(function(e){ return localDateStr(e.ts) === today; });
  }

  /* ---------------- Daily "3 things" todo list ---------------- */
  function todayKey(){ return localDateStr(Date.now()); }

  function ensureDailyTodos(){
    if(!state.dailyTodos) state.dailyTodos = {};
    var key = todayKey();
    if(!state.dailyTodos[key]){
      state.dailyTodos[key] = [ { text: '', done: false }, { text: '', done: false }, { text: '', done: false } ];
      saveState();
    }
    return state.dailyTodos[key];
  }

  function renderDailyTodos(){
    var items = ensureDailyTodos();
    document.getElementById('dailyTodoDate').textContent =
      new Date().toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

    var list = document.getElementById('dailyTodoList');
    list.innerHTML = items.map(function(item, idx){
      return '<div class="daily-todo-row'+(item.done?' done':'')+'">' +
        '<button class="daily-todo-check'+(item.done?' done':'')+'" data-idx="'+idx+'">'+(item.done?'✓':'')+'</button>' +
        '<input type="text" class="daily-todo-input" data-idx="'+idx+'" placeholder="Add a goal for today…" maxlength="60">' +
      '</div>';
    }).join('');

    // Set values via the DOM property (not an HTML attribute) so free text with quotes
    // or special characters can never break the markup.
    list.querySelectorAll('.daily-todo-input').forEach(function(input, idx){
      input.value = items[idx].text;
      input.addEventListener('change', function(){
        var arr = ensureDailyTodos();
        arr[idx].text = input.value;
        saveState();
      });
    });
    list.querySelectorAll('.daily-todo-check').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        var arr = ensureDailyTodos();
        arr[idx].done = !arr[idx].done;
        saveState();
        renderDailyTodos();
      });
    });
  }

  /* ---------------- Sleep tracker ---------------- */
  // Approximates bedtime/wake time from real usage: a "heartbeat" keeps state.lastOpenTs
  // fresh to roughly the last moment the app was actually open, so when the app is opened
  // again after a long, night-shaped gap we can infer sleep -> wake.
  var SLEEP_HEARTBEAT_MS = 60000;

  function fmtClock(ts){
    return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function parseTimeStr(s){
    var m = (s || '').trim().match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    var h = parseInt(m[1], 10), mnt = parseInt(m[2], 10);
    if(h < 0 || h > 23 || mnt < 0 || mnt > 59) return null;
    return h * 60 + mnt;
  }

  // Runs once per page load. If the gap since the last recorded activity looks like an
  // overnight gap (last seen in the evening, now seeing it in the morning), record a
  // sleep/wake pair for that night.
  function trackSleepWake(){
    var now = Date.now();
    var prev = state.lastOpenTs;
    if(prev){
      var gapHours = (now - prev) / 3600000;
      var prevHour = new Date(prev).getHours();
      var nowHour = new Date(now).getHours();
      var looksLikeNight = (prevHour >= 20 || prevHour < 4);
      var looksLikeMorning = (nowHour >= 4 && nowHour < 12);
      if(gapHours >= 3 && looksLikeNight && looksLikeMorning){
        var nightKey = localDateStr(prev);
        if(!state.sleepLog) state.sleepLog = {};
        state.sleepLog[nightKey] = { autoSleep: prev, autoWake: now, sleep: prev, wake: now };
      }
    }
    state.lastOpenTs = now;
    saveState();
    setInterval(function(){ state.lastOpenTs = Date.now(); saveState(); }, SLEEP_HEARTBEAT_MS);
  }

  function getLatestSleepEntry(){
    if(!state.sleepLog) return null;
    var keys = Object.keys(state.sleepLog).sort().reverse();
    if(!keys.length) return null;
    return { key: keys[0], entry: state.sleepLog[keys[0]] };
  }

  function renderSleep(){
    var body = document.getElementById('sleepBody');
    var latest = getLatestSleepEntry();
    if(!latest){
      body.innerHTML = '<div class="sleep-empty">No sleep detected yet — open the app once in the evening and again the next morning, and it will show up here.</div>';
      return;
    }
    var e = latest.entry;
    var durMin = Math.max(0, Math.round((e.wake - e.sleep) / 60000));
    body.innerHTML =
      '<div class="sleep-times">' +
        '<div class="sleep-stat"><span class="sleep-stat-label">Asleep</span><span class="sleep-stat-value">'+fmtClock(e.sleep)+'</span></div>' +
        '<div class="sleep-stat"><span class="sleep-stat-label">Awake</span><span class="sleep-stat-value">'+fmtClock(e.wake)+'</span></div>' +
        '<div class="sleep-stat"><span class="sleep-stat-label">Total</span><span class="sleep-stat-value">'+fmtDuration(durMin)+'</span></div>' +
      '</div>';
  }

  document.getElementById('sleepEditBtn').addEventListener('click', function(){
    var latest = getLatestSleepEntry();
    if(!latest){ alert('No sleep detected yet to adjust — it shows up after an evening + next-morning app open.'); return; }
    var e = latest.entry;
    var curSleep = new Date(e.sleep), curWake = new Date(e.wake);

    var sleepStr = prompt('Bedtime (HH:MM, 24h):', String(curSleep.getHours()).padStart(2,'0')+':'+String(curSleep.getMinutes()).padStart(2,'0'));
    if(sleepStr === null) return;
    var wakeStr = prompt('Wake time (HH:MM, 24h):', String(curWake.getHours()).padStart(2,'0')+':'+String(curWake.getMinutes()).padStart(2,'0'));
    if(wakeStr === null) return;

    var sleepMin = parseTimeStr(sleepStr);
    var wakeMin = parseTimeStr(wakeStr);
    if(sleepMin == null || wakeMin == null){ alert('Please use HH:MM, e.g. 23:15'); return; }

    // Bedtime lands on the "night" date; if the chosen clock time reads as morning-ish,
    // assume it rolled past midnight into the following date.
    var nightDate = dateFromStr(latest.key);
    var newSleep = new Date(nightDate);
    newSleep.setHours(Math.floor(sleepMin / 60), sleepMin % 60, 0, 0);
    if(newSleep.getHours() < 12){ newSleep.setDate(newSleep.getDate() + 1); }

    var wakeDate = new Date(nightDate);
    wakeDate.setDate(wakeDate.getDate() + 1);
    var newWake = new Date(wakeDate);
    newWake.setHours(Math.floor(wakeMin / 60), wakeMin % 60, 0, 0);

    // Guardrails so the numbers stay honest: bedtime can't be earlier than the last time the
    // app was actually open that night, and wake time can't be more than 30 min earlier than
    // when the app was actually first opened that morning.
    if(newSleep.getTime() < e.autoSleep){
      alert('Bedtime can\'t be earlier than ' + fmtClock(e.autoSleep) + ' — that\'s the last time the app was open that night.');
      return;
    }
    if(newWake.getTime() < e.autoWake - 30*60000){
      alert('Wake time can\'t be more than 30 minutes earlier than ' + fmtClock(e.autoWake) + ' — that\'s when the app was first opened that morning.');
      return;
    }

    e.sleep = newSleep.getTime();
    e.wake = newWake.getTime();
    saveState();
    renderSleep();
    showToast('Sleep times updated');
  });

  function weeklyMinutes(entries){
    var cutoff = Date.now() - 7*86400000;
    return entries.filter(function(e){ return e.ts >= cutoff; })
                  .reduce(function(sum,e){ return sum + e.minutes; }, 0);
  }

  function fmtDuration(mins){
    if(mins <= 0) return '0m';
    var h = Math.floor(mins/60), m = mins%60;
    if(h && m) return h+'h '+m+'m';
    if(h) return h+'h';
    return m+'m';
  }

  function relativeTime(ts){
    var diff = Date.now() - ts;
    var mins = Math.floor(diff/60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs/24);
    var d = new Date(ts);
    var time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    if(days === 1) return 'Yesterday, ' + time;
    if(days < 7) return days + 'd ago';
    return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ', ' + time;
  }

  function entriesFor(catId, typeId){
    return state.logs.filter(function(l){
      return l.catId === catId && (typeId == null || l.typeId === typeId);
    });
  }

  function findCat(catId){ return state.categories.find(function(c){ return c.id===catId; }); }
  function findType(cat, typeId){ return cat.types.find(function(t){ return t.id===typeId; }); }

  /* ---------------- rendering ---------------- */
  function renderAll(){
    renderPokemon();
    renderDailyTodos();
    renderSleep();
    renderCategories();
    renderLog();
  }

  function renderPokemon(){
    var info = getPokemonInfo();
    var sprite = document.getElementById('tamaSprite');
    sprite.src = spriteUrl(info.stage.id);
    sprite.alt = info.stage.name;
    document.getElementById('tamaName').textContent = info.stage.name;
    document.getElementById('tamaLvlBadge').textContent = 'Lv ' + info.level;

    var pips = document.querySelectorAll('#tamaPips span');
    pips.forEach(function(p, i){ p.classList.toggle('filled', i <= info.stageIdx); });

    var span = info.nextBase - info.curBase;
    var into = info.xp - info.curBase;
    var pct = span > 0 ? Math.min(100, Math.round((into / span) * 100)) : 100;
    document.getElementById('tamaXpFill').style.width = pct + '%';
    document.getElementById('tamaXpLabel').textContent = into + ' / ' + span + ' XP to next level';

    var hpPct = info.maxHealth > 0 ? Math.round((info.health / info.maxHealth) * 100) : 0;
    var hpFill = document.getElementById('tamaHpFill');
    hpFill.style.width = hpPct + '%';
    hpFill.classList.toggle('low', hpPct <= 40 && hpPct > 15);
    hpFill.classList.toggle('critical', hpPct <= 15);
    document.getElementById('tamaHpLabel').textContent = info.health + ' / ' + info.maxHealth + ' HP';

    document.getElementById('tamaCaption').textContent = localStorage.getItem('tamaCaption') || 'This week\'s companion';
    if(pokemonJustRolled){
      pokemonJustRolled = false;
      showToast('A new companion appeared: ' + info.stage.name + '!');
    }
  }

  function renderCategories(){
    var container = document.getElementById('categoryList');
    container.innerHTML = '';

    if(!state.categories.length){
      container.innerHTML = '<div class="empty-state">No categories yet.<br>Tap ⚙ to add one.</div>';
      return;
    }

    state.categories.forEach(function(cat){
      var catEntries = entriesFor(cat.id, null);
      var sInfo = streakInfo(catEntries);
      var weekMin = weeklyMinutes(catEntries);

      var card = document.createElement('div');
      card.className = 'category-card';
      card.style.setProperty('--cat-color', cat.color || '#4fa8a0');

      var streakHtml;
      if(sInfo.type === 'active'){
        streakHtml = '<span class="streak-stamp active">'+(cat.isBad?'⚠':'🔥')+' '+sInfo.streak+' day'+(sInfo.streak===1?'':'s')+'</span>';
      } else if(sInfo.type === 'stale'){
        streakHtml = '<span class="streak-stamp stale">'+sInfo.daysAgo+'d since last</span>';
      } else {
        streakHtml = '<span class="streak-stamp none">No logs yet</span>';
      }

      // Habits with a set frequency that are overdue surface here automatically,
      // no need to open a row to find them. Bad habits never get "due" reminders.
      var dueTypes = cat.isBad ? [] : cat.types.filter(function(t){ return isTypeDue(cat.id, t); });
      var dueHtml = '';
      if(dueTypes.length){
        dueHtml = '<div class="due-section">' + dueTypes.map(function(t){
          var days = daysSinceLastLog(entriesFor(cat.id, t.id));
          var sub = (days === Infinity ? 'Never logged' : days + 'd since last') + ' · ' + fmtFreq(t.freq);
          var tier = getMultiplierTier(t);
          var controlsHtml = t.isChecklist
            ? '<button class="log-btn due-check-btn" style="width:100%;">'+(isDoneToday(cat.id, t.id) ? '✓ Done today' : 'Mark done')+'</button>'
            : '<div class="log-controls">' +
                '<button class="step-btn" data-step="-5">−5</button>' +
                '<input type="number" class="minutes-input" value="15" min="5" step="5">' +
                '<button class="step-btn" data-step="5">+5</button>' +
                '<button class="step-btn timer-start-btn" title="Start a timer instead">⏱</button>' +
                '<button class="log-btn">Log</button>' +
              '</div>';
          return '<div class="due-item" data-cat="'+cat.id+'" data-type="'+t.id+'">' +
            '<div class="due-item-head"><span class="due-badge">⏰ Due</span><span class="due-name"><img class="candy-icon" src="'+tier.sprite+'" alt="'+tier.label+' candy"> '+escapeHtml(t.name)+'</span></div>' +
            '<div class="due-sub">'+sub+'</div>' +
            controlsHtml +
          '</div>';
        }).join('') + '</div>';
      }

      var listHtml = '<div class="type-list" data-cat="'+cat.id+'">' +
        cat.types.map(function(t){ return typeRowHtml(cat, t); }).join('')
        //  +'<button class="add-type-row" data-add-type="'+cat.id+'">+ Add activity</button>' +
      '</div>';

      card.innerHTML =
        '<div class="cat-header">' +
          '<span class="cat-icon">'+(cat.icon||'📌')+'</span>' +
          '<span class="cat-name">'+escapeHtml(cat.name)+(cat.isBad?' <span class="bad-tag">bad habit</span>':'')+'</span>' +
          '<div class="cat-meta">' + streakHtml + '<span class="week-total">'+fmtDuration(weekMin)+' this wk</span></div>' +
        '</div>' +
        dueHtml +
        listHtml;

      container.appendChild(card);

      // Wire up the auto-surfaced due items.
      card.querySelectorAll('.due-item').forEach(function(dueEl){
        var tId = dueEl.getAttribute('data-type');
        var mInput = dueEl.querySelector('.minutes-input');
        dueEl.querySelectorAll('.step-btn[data-step]').forEach(function(btn){
          btn.addEventListener('click', function(){
            var delta = parseInt(btn.getAttribute('data-step'), 10);
            var val = parseInt(mInput.value, 10) || 0;
            mInput.value = Math.max(5, val + delta);
          });
        });
        var timerBtn = dueEl.querySelector('.timer-start-btn');
        if(timerBtn){ timerBtn.addEventListener('click', function(){ startTimerFor(cat.id, tId); }); }
        var logBtn = dueEl.querySelector('.log-btn:not(.due-check-btn)');
        if(logBtn){
          logBtn.addEventListener('click', function(){
            var mins = parseInt(mInput.value, 10);
            if(!mins || mins <= 0) return;
            commitLog(cat.id, tId, mins);
          });
        }
        var checkBtn = dueEl.querySelector('.due-check-btn');
        if(checkBtn && !isDoneToday(cat.id, tId)){
          checkBtn.addEventListener('click', function(){ commitLog(cat.id, tId, CHECKLIST_MINUTES); });
        }
      });

      // Wire up the compact activity rows: tap the row to open full details, tap the
      // checkbox (checklist items only) to mark done without opening anything.
      card.querySelectorAll('[data-open]').forEach(function(el){
        el.addEventListener('click', function(){
          var parts = el.getAttribute('data-open').split('|');
          openDetailPopup(parts[0], parts[1]);
        });
      });
      card.querySelectorAll('[data-check]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var parts = btn.getAttribute('data-check').split('|');
          if(isDoneToday(parts[0], parts[1])) return;
          commitLog(parts[0], parts[1], CHECKLIST_MINUTES);
        });
      });
      var addTypeBtn = card.querySelector('[data-add-type]');
      if(addTypeBtn){
        addTypeBtn.addEventListener('click', function(){ showAddTypeForm(cat.id); });
      }
    });
  }

  // Compact vertical-list row for one activity: name, candy tier, frequency, streak/since,
  // and a squished 14-day heatmap. Tapping it opens the full detail popup.
  function typeRowHtml(cat, t){
    var entries = entriesFor(cat.id, t.id);
    var sInfo = streakInfo(entries);
    var sinceText;
    if(sInfo.type === 'active'){
      sinceText = (cat.isBad ? '⚠' : '🔥') + sInfo.streak + 'd';
    } else if(sInfo.type === 'stale'){
      sinceText = sInfo.daysAgo + 'd ago';
    } else {
      sinceText = 'Never';
    }
    var tier = getMultiplierTier(t);
    var doneToday = t.isChecklist && isDoneToday(cat.id, t.id);
    var checkHtml = t.isChecklist
      ? '<button class="type-check'+(doneToday?' done':'')+'" data-check="'+cat.id+'|'+t.id+'">'+(doneToday?'✓':'')+'</button>'

          '<span class="type-row-name">'+escapeHtml(t.name)+'</span>' +

          '<span class="type-row-since">'+sinceText+'</span>' +

        heatmapHtml(cat.id, t.id, cat.isBad, false) +

  /* ---------------- Timer popup ---------------- */
  // Persisted to state.activeTimer so a page refresh (or reopening the app later) resumes
  // the running timer instead of losing it.
  var timerTickInterval = null;
  var timerMoveInterval = null;

  function fmtTimerReadout(ms){
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    var text = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    return hh > 0 ? String(hh).padStart(2, '0') + ':' + text : text;
  }

  function updateTimerReadout(){
    if(!state.activeTimer) return;
    document.getElementById('timerReadout').textContent = fmtTimerReadout(Date.now() - state.activeTimer.startTs);
  }

  // Makes the companion sprite wander back and forth inside the timer screen, Pokéwatch-style.
  function startTimerSpriteMovement(){
    var screen = document.getElementById('timerScreen');
    var sprite = document.getElementById('timerSprite');
    function moveOnce(){
      var maxX = Math.max(0, screen.clientWidth - sprite.clientWidth);
      var curX = parseFloat(sprite.style.left || '0');
      var newX = Math.random() * maxX;
      sprite.style.transition = 'left 1.8s linear';
      sprite.style.transform = newX < curX ? 'scaleX(-1)' : 'scaleX(1)';
      sprite.style.left = newX + 'px';
    }
    clearInterval(timerMoveInterval);
    moveOnce();
    timerMoveInterval = setInterval(moveOnce, 2200);
  }
  function stopTimerSpriteMovement(){
    clearInterval(timerMoveInterval);
    timerMoveInterval = null;
  }

  function startTimerFor(catId, typeId){
    if(state.activeTimer && (state.activeTimer.catId !== catId || state.activeTimer.typeId !== typeId)){
      alert('A timer is already running for another activity. Finish or cancel it first.');
      openTimerPopup(state.activeTimer.catId, state.activeTimer.typeId, state.activeTimer.startTs);
      return;
    }
    openTimerPopup(catId, typeId, (state.activeTimer && state.activeTimer.startTs) || Date.now());
  }

  function openTimerPopup(catId, typeId, startTs){
    var cat = findCat(catId);
    var type = cat && findType(cat, typeId);
    if(!cat || !type){
      state.activeTimer = null;
      saveState();
      return;
    }
    state.activeTimer = { catId: catId, typeId: typeId, startTs: startTs || Date.now() };
    saveState();

    document.getElementById('timerTitle').textContent = (cat.icon || '📌') + ' ' + type.name;
    var info = getPokemonInfo();
    var sprite = document.getElementById('timerSprite');
    sprite.src = spriteUrl(info.stage.id);
    sprite.alt = info.stage.name;
    sprite.style.left = '0px';
    sprite.style.transform = 'scaleX(1)';

    updateTimerReadout();
    document.getElementById('timerModal').classList.remove('hidden');
    startTimerSpriteMovement();
    clearInterval(timerTickInterval);
    timerTickInterval = setInterval(updateTimerReadout, 1000);
  }

  function closeTimerPopup(){
    clearInterval(timerTickInterval);
    timerTickInterval = null;
    stopTimerSpriteMovement();
    document.getElementById('timerModal').classList.add('hidden');
  }

  document.getElementById('timerCancelBtn').addEventListener('click', function(){
    state.activeTimer = null;
    saveState();
    closeTimerPopup();
    showToast('Timer cancelled');
  });

  document.getElementById('timerStopBtn').addEventListener('click', function(){
    var t = state.activeTimer;
    closeTimerPopup();
    if(!t){ return; }
    var elapsedMin = Math.max(1, Math.round((Date.now() - t.startTs) / 60000));
    state.activeTimer = null;
    saveState();
    commitLog(t.catId, t.typeId, elapsedMin);
  });

  // Companion message based on current weather, if available (uses Open-Meteo free API, no key required).
  function fetchWeatherMessage(){

    // only update every 10s max
    var lastFetch = localStorage.getItem('lastWeatherFetch');
    if(lastFetch && (Date.now() - new Date(lastFetch).getTime()) < 10000){
      console.log('Weather fetch skipped (last fetch was less than 10s ago).');
      return;
    }
    localStorage.setItem('lastWeatherFetch', new Date().toISOString());
    // default to sydney, AU if geolocation fails
    var geo = navigator.geolocation;
    if (geo) {
      geo.getCurrentPosition(async function(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        await fetchWeather(lat, lon);
      }, async function(error) {
        console.warn('Geolocation failed, using default location (Sydney, AU).', error);
        await fetchWeather(-33.8688, 151.2093); // Sydney, AU
      });
    } else {
      console.warn('Geolocation not supported, using default location (Sydney, AU).');
      fetchWeather(-33.8688, 151.2093); // Sydney, AU
    }

    async function fetchWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true';
      console.log('Fetching weather from:', url);
      try {
        const resp = await fetch(url);
        const data = await resp.json();
        console.log('Weather data:', data, resp);
        if(!data || !data.current_weather) return;
        var msg;

        // break down weather into sunniness, temperature, and precipitation

        // then can generate appropriate messages
        // grass types prefer sun, fire types prefer heat, water types prefer rain, etc.

        let weathercode = data.current_weather.weathercode; // weather code for sun/rain/snow/etc.
        let temp = data.current_weather.temperature; // temperature in Celsius
        console.log('Weather code:', weathercode, 'Temp:', temp);

        // get weather condition
        let weatherCondition = '';
        if (weathercode === 0) weatherCondition = 'sunny';
        else if (weathercode === 1 || weathercode === 2) weatherCondition = 'partly cloudy';
        else if (weathercode === 3) weatherCondition = 'cloudy';
        else if (weathercode === 61 || weathercode === 63 || weathercode === 65) weatherCondition = 'rainy';
        else if (weathercode === 71 || weathercode === 73 || weathercode === 75) weatherCondition = 'snowy';
        else weatherCondition = 'unpredictable';

        // get pokemon type
        let pokemonType = getPokemonInfo().line.type; // grass, fire, water

        // generate message based on weather and pokemon type
        // get possible messages for the pokemon type
        let possibleMessages = [];
        getPokemonInfo().line.messages.forEach(function(msgObj) {
          if (msgObj.type === 'happy' && (weatherCondition === 'sunny' || weatherCondition === 'partly cloudy')) {
            possibleMessages.push(msgObj.msg);
          } else if (msgObj.type === 'sad' && (weatherCondition === 'rainy' || weatherCondition === 'snowy')) {
            possibleMessages.push(msgObj.msg);
          } else if (msgObj.type === 'happy' && weatherCondition === 'unpredictable') {
            possibleMessages.push(msgObj.msg);
          }
        });
        possibleMessages = possibleMessages.concat(type_x_weather_condition_messages[pokemonType][weatherCondition]);

        // Replace "your ... pokemon" or "water type pokemon" or "POKEMON" with the actual pokemon name
        possibleMessages = possibleMessages.map(function(msg) {
          // filter out all instaces of "your" "fire type" with empty
          msg = msg.toLowerCase();
          msg = msg.replace(/your |.*?type|/gi, '');
          // then replace pokemon etc
          return msg.replace(/your .* pokemon|pokemon|Pokémon|POKEMON/gi, getPokemonInfo().stage.name);
        });

        console.log('Possible messages:', possibleMessages);
        if (possibleMessages.length > 0) {
          var randomIndex = Math.floor(Math.random() * possibleMessages.length);
          var randomMessage = possibleMessages[randomIndex];
          localStorage.setItem('tamaCaption', randomMessage);
          document.getElementById('tamaCaption').textContent = randomMessage
        } else {
          document.getElementById('tamaCaption').textContent = 'POKEMON is feeling neutral.';
        }

      } catch (err) {
        console.warn('Weather fetch failed:', err);
      };
    }
    // fetchWeather(-33.8688, 151.2093); // Sydney, AU
  }

    '</div>';

    // Select companion dropdown
    html += '<div class="new-cat-form" style="margin-top:24px; text-align:center;">' +
      '<label>Select companion</label>' +
      '<select id="selectCompanion">' +
        STARTER_LINES.map(function(line, idx){
          return '<option value="'+idx+'">'+line.stages[0].name+'</option>';
        }).join('') +
      '</select>' +
    '</div>';

    // Clear log button
    html += '<div class="new-cat-form" style="margin-top:24px; text-align:center;">' +
      '<button class="primary-btn" id="clearLogBtn">Clear all logs</button>' +
    '</div>';
    manageContent.innerHTML = html;

    

    // reroll button handler
    var reroll = document.getElementById('rerollBtn');
    if(reroll){
      reroll.addEventListener('click', function(){
        // force a new companion for this week
        var wk = weekIndex(Date.now());
        var prevIdx = state.pokemon ? state.pokemon.lineIndex : -1;
        var idx = Math.floor(Math.random() * STARTER_LINES.length);
        if(STARTER_LINES.length > 1){
          while(idx === prevIdx){ idx = Math.floor(Math.random() * STARTER_LINES.length); }
        }
        state.pokemon = { weekKey: wk, lineIndex: idx, xp: 0 };
        pokemonJustRolled = true;
        saveState();
        renderAll();
        showToast('Rerolled companion!');
      });
    }

    // select companion dropdown handler
    var selectComp = document.getElementById('selectCompanion');
    if(selectComp){
      selectComp.value = state.pokemon ? state.pokemon.lineIndex : 0;
      selectComp.addEventListener('change', function(){
        var idx = parseInt(selectComp.value, 10);
        var wk = weekIndex(Date.now());
        state.pokemon = { weekKey: wk, lineIndex: idx, xp: 0 };
        pokemonJustRolled = true;
        saveState();
        renderAll();
        showToast('Selected companion: ' + STARTER_LINES[idx].stages[0].name);
      });
    }

    // clear log button handler
    var clearLog = document.getElementById('clearLogBtn');
    if(clearLog){
      clearLog.addEventListener('click', function(){
        if(!confirm('Are you sure you want to clear all logged activity? This cannot be undone.')) return;
        state.logs = [];
        saveState();
        renderAll();
        showToast('All logs cleared.');
      });
    }

    // color swatches
    var swatchWrap = document.getElementById('colorSwatches');
    CAT_COLORS.forEach(function(c){
      var sw = document.createElement('div');
      sw.className = 'swatch' + (c === selectedColor ? ' selected' : '');
      sw.style.background = c;
      sw.addEventListener('click', function(){
        selectedColor = c;
        swatchWrap.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('selected'); });
        sw.classList.add('selected');
      });
      swatchWrap.appendChild(sw);
    });

    // toggle a category between "bad habit" and normal
    manageContent.querySelectorAll('[data-toggle-bad]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var catId = btn.getAttribute('data-toggle-bad');
        var cat = findCat(catId);
        cat.isBad = !cat.isBad;
        saveState();
        renderManageContent();
        renderCategories();
      });
    });

    // manually set/clear a repeat frequency on an activity type
    manageContent.querySelectorAll('[data-freq-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-freq-edit').split('|');
        var catId = parts[0], typeId = parts[1];
        var cat = findCat(catId);
        var type = findType(cat, typeId);
        var current = type.freq ? (type.freq.n + type.freq.unit) : '';
        var val = prompt('Repeat frequency for "'+type.name+'" (e.g. "2w" for every 2 weeks, "10d" for every 10 days). Leave blank to remove.', current);
        if(val === null) return; // cancelled
        val = val.trim();
        if(!val){
          delete type.freq;
        } else {
          var freq = parseFrequencyString(val);
          if(!freq){ alert('Could not understand that. Try a format like "2w" or "10d".'); return; }
          type.freq = freq;
        }
        saveState();
        renderManageContent();
        renderCategories();
      });
    });

    // cycle an activity's XP/HP multiplier tier (XS -> M -> XL -> XS)
    manageContent.querySelectorAll('[data-cycle-mult]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-cycle-mult').split('|');
        var cat = findCat(parts[0]);
        var type = findType(cat, parts[1]);
        cycleMultiplierTier(type);
        saveState();
        renderManageContent();
        renderCategories();
        var tier = getMultiplierTier(type);
        showToast(type.name + ' now worth ' + tier.mult + 'x (' + tier.label + ' candy)');
      });
    });

    // toggle an activity between a timed log and a TODO/checkbox item
    manageContent.querySelectorAll('[data-toggle-checklist]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-toggle-checklist').split('|');
        var cat = findCat(parts[0]);
        var type = findType(cat, parts[1]);
        type.isChecklist = !type.isChecklist;
        saveState();
        renderManageContent();
        renderCategories();
        showToast(type.name + ' is now a ' + (type.isChecklist ? 'TODO checkbox' : 'timed activity'));
      });
    });

    // delete category
    manageContent.querySelectorAll('[data-del-cat]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var catId = btn.getAttribute('data-del-cat');
        var cat = findCat(catId);
        var count = entriesFor(catId, null).length;
        var msg = 'Delete "'+cat.name+'" and its activities?' + (count ? ' This will also remove '+count+' logged entr'+(count===1?'y':'ies')+'.' : '');
        if(!confirm(msg)) return;
        state.categories = state.categories.filter(function(c){ return c.id!==catId; });
        state.logs = state.logs.filter(function(l){ return l.catId!==catId; });
        delete openTypeByCat[catId];
        saveState();
        renderManageContent();
        renderAll();
      });
    });

    // delete type
    manageContent.querySelectorAll('[data-del-type]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-del-type').split('|');
        var catId = parts[0], typeId = parts[1];
        var cat = findCat(catId);
        var type = findType(cat, typeId);
        var count = entriesFor(catId, typeId).length;
        var msg = 'Delete "'+type.name+'"?' + (count ? ' This will also remove '+count+' logged entr'+(count===1?'y':'ies')+'.' : '');
        if(!confirm(msg)) return;
        cat.types = cat.types.filter(function(t){ return t.id!==typeId; });
        state.logs = state.logs.filter(function(l){ return !(l.catId===catId && l.typeId===typeId); });
        if(openTypeByCat[catId] === typeId) openTypeByCat[catId] = null;
        saveState();
        renderManageContent();
        renderAll();
      });
    });

    // quick-add type per category
    manageContent.querySelectorAll('[data-quick-add]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var catId = btn.getAttribute('data-quick-add');
        var input = document.getElementById('quickType_'+catId);
        var raw = input.value.trim();
        if(!raw) return;
        var parsed = parseFrequencyFromName(raw);
        if(!parsed.name) return;
        var newType = { id: uid('t'), name: parsed.name };
        if(parsed.freq) newType.freq = parsed.freq;
        findCat(catId).types.push(newType);
        saveState();
        renderManageContent();
        renderCategories();
      });
    });

    // add category
    document.getElementById('addCatBtn').addEventListener('click', function(){
      var nameInput = document.getElementById('newCatName');
      var iconInput = document.getElementById('newCatIcon');
      var badInput = document.getElementById('newCatBad');
      var name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      var isBad = !!(badInput && badInput.checked);
      var icon = iconInput.value.trim() || (isBad ? '⚠' : '📌');
      state.categories.push({ id: uid('cat'), name: name, icon: icon, color: selectedColor, isBad: isBad, types: [] });
      saveState();
      nameInput.value = '';
      iconInput.value = '';
      if(badInput) badInput.checked = false;
      renderManageContent();
      renderCategories();
    });
  }

  document.getElementById('manageBtn').addEventListener('click', openManageModal);
  document.querySelectorAll('[data-close]').forEach(function(btn){
    btn.addEventListener('click', closeModals);
  });
  document.querySelectorAll('.modal-overlay').forEach(function(overlay){
    overlay.addEventListener('click', function(e){
      if(e.target === overlay) closeModals();
    });
  });

  trackSleepWake();
  renderAll();
  fetchWeatherMessage();

  // If a timer was left running (e.g. the page was refreshed), resume it rather than losing it.
  if(state.activeTimer){
    openTimerPopup(state.activeTimer.catId, state.activeTimer.typeId, state.activeTimer.startTs);
  }
})();
</script>
</body>
</html>
