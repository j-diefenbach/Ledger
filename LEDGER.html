  function renderReminderDetailModal(){
    var rem = reminderEditingId ? findReminder(reminderEditingId) : null;
    document.getElementById('reminderDetailTitle').textContent = rem ? 'Edit reminder' : 'New reminder';

    var dueDate = (rem && rem.dueTs != null) ? localDateStr(rem.dueTs) : '';
    var dueTime = (rem && rem.dueTs != null && !rem.allDay)
      ? (String(new Date(rem.dueTs).getHours()).padStart(2,'0') + ':' + String(new Date(rem.dueTs).getMinutes()).padStart(2,'0'))
      : '';
    var repN = (rem && rem.repeat) ? rem.repeat.n : '';
    var repUnit = (rem && rem.repeat) ? rem.repeat.unit : 'd';
    var priority = rem ? rem.priority : 0;

    var html =
      '<label>What</label>' +
      '<input type="text" id="remText" maxlength="120" placeholder="Reminder text" value="' + escapeAttr(rem ? rem.text : '') + '">' +
      '<label>Date</label>' +
      '<input type="date" id="remDate" value="' + dueDate + '">' +
      '<label>Time (leave blank for all-day)</label>' +
      '<input type="time" id="remTime" value="' + dueTime + '">' +
      '<label>Repeat every</label>' +
      '<div class="inline-add">' +
        '<input type="number" id="remRepeatN" min="0" placeholder="none" value="' + repN + '" style="max-width:90px;">' +
        '<select id="remRepeatUnit">' +
          '<option value="d"' + (repUnit==='d'?' selected':'') + '>days</option>' +
          '<option value="w"' + (repUnit==='w'?' selected':'') + '>weeks</option>' +
        '</select>' +
      '</div>' +
      '<label>Priority</label>' +
      '<select id="remPriority">' +
        '<option value="0"' + (priority===0?' selected':'') + '>None</option>' +
        '<option value="1"' + (priority===1?' selected':'') + '>! Medium</option>' +
        '<option value="2"' + (priority===2?' selected':'') + '>!! High</option>' +
      '</select>' +
      '<button class="primary-btn" id="remSaveBtn">' + (rem ? 'Save changes' : 'Add reminder') + '</button>' +
      (rem ? '<button class="mini-danger" id="remDeleteBtn" style="width:100%;margin-top:10px;padding:10px;">Delete reminder</button>' : '');

    document.getElementById('reminderDetailContent').innerHTML = html;

    document.getElementById('remSaveBtn').addEventListener('click', function(){
      var text = document.getElementById('remText').value.trim();
      var dateVal = document.getElementById('remDate').value;
      var timeVal = document.getElementById('remTime').value;
      var nVal = parseInt(document.getElementById('remRepeatN').value, 10);
      var unitVal = document.getElementById('remRepeatUnit').value;
      var priorityVal = parseInt(document.getElementById('remPriority').value, 10);

      var dueTs = null, allDay = false;
      if(dateVal){
        var d = dateFromStr(dateVal);
        if(timeVal){
          var tparts = timeVal.split(':');
          d.setHours(parseInt(tparts[0],10), parseInt(tparts[1],10), 0, 0);
          allDay = false;
        } else {
          d.setHours(9,0,0,0);
          allDay = true;
        }
        dueTs = d.getTime();
      }
      var repeat = (nVal && nVal > 0) ? { n: nVal, unit: unitVal } : null;
      if(repeat && dueTs == null){
        var anchor = new Date(); anchor.setHours(9,0,0,0);
        dueTs = anchor.getTime();
        allDay = true;
      }

      var fields = { text: text || 'Reminder', dueTs: dueTs, allDay: allDay, repeat: repeat, priority: priorityVal };
      if(rem){ updateReminder(rem.id, fields); } else { addReminder(fields); }
      closeModals();
      renderTabs();
    });

    if(rem){
      document.getElementById('remDeleteBtn').addEventListener('click', function(){
        if(!confirm('Delete this reminder?')) return;
        deleteReminder(rem.id);
        closeModals();
        renderTabs();
      });
    }
  }

  /* ---------------- Calendar overview ---------------- */
  var calendarViewMonth = (function(){ var d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; })();
  var calendarSelectedDay = null;
  var CAL_HEAT = ['rgba(255,255,255,0.04)', 'rgba(79,168,160,0.18)', 'rgba(79,168,160,0.38)', 'rgba(79,168,160,0.6)', 'rgba(79,168,160,0.85)'];

  function calendarHeatLevel(mins){
    if(mins <= 0) return 0;
    if(mins < 20) return 1;
    if(mins < 45) return 2;
    if(mins < 90) return 3;
    return 4;
  }

  // date -> { mins: total minutes across every category that day, cats: {catId:true, ...} }
  function calendarDayTotals(){
    var map = {};
    state.logs.forEach(function(l){
      var d = localDateStr(l.ts);
      if(!map[d]) map[d] = { mins: 0, cats: {} };
      map[d].mins += l.minutes;
      map[d].cats[l.catId] = true;
    });
    return map;
  }

  function calendarDayDetailHtml(dStr){
    var entries = state.logs.filter(function(l){ return localDateStr(l.ts) === dStr; });
    var dLabel = dateFromStr(dStr).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    var totalMins = entries.reduce(function(s,e){ return s + e.minutes; }, 0);
    var journalRec = state.journal && state.journal[dStr];

    var rows = entries.slice().sort(function(a,b){ return b.ts - a.ts; }).map(function(e){
      var cat = findCat(e.catId);
      var type = cat && findType(cat, e.typeId);
      return '<div class="cal-detail-row">' +
        '<span class="cal-dot" style="background:'+(cat ? (cat.color||'#4fa8a0') : '#666')+'"></span>' +
        '<span class="cal-detail-name">'+(cat ? escapeHtml(cat.name) : '—')+' — '+(type ? escapeHtml(type.name) : 'Deleted activity')+'</span>' +
        '<span class="cal-detail-mins">'+fmtDuration(e.minutes)+'</span>' +
      '</div>';
    }).join('');

    return '<div class="calendar-detail">' +
      '<div class="calendar-detail-head"><strong>'+dLabel+'</strong><button class="chip-freq-btn" data-cal-day="'+dStr+'" title="Close">&times;</button></div>' +
      (entries.length ? ('<div class="cal-detail-total">'+fmtDuration(totalMins)+' total</div>' + rows) : '<div class="empty-state" style="padding:14px;">No activity logged.</div>') +
      (journalRec && journalRec.words ? '<div class="cal-detail-journal">📓 Journal: '+journalRec.words+' words</div>' : '') +
    '</div>';
  }

  function calendarHtml(){
    var y = calendarViewMonth.year, m = calendarViewMonth.month;
    var totals = calendarDayTotals();
    var journalMap = state.journal || {};

    var firstOfMonth = new Date(y, m, 1);
    var startWeekday = firstOfMonth.getDay();
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var monthLabel = firstOfMonth.toLocaleDateString([], { month: 'long', year: 'numeric' });
    var todayStr = localDateStr(Date.now());

    var cells = '';
    for(var i=0; i<startWeekday; i++){ cells += '<div class="cal-day-cell cal-day-empty"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dStr = localDateStr(new Date(y, m, day).getTime());
      var info = totals[dStr];
      var mins = info ? info.mins : 0;
      var level = calendarHeatLevel(mins);
      var catIds = info ? Object.keys(info.cats) : [];
      var dotsHtml = catIds.slice(0, 4).map(function(cid){
        var cat = findCat(cid);
        var color = cat ? (cat.color || '#4fa8a0') : '#666';
        return '<span class="cal-dot" style="background:'+color+'" title="'+(cat?escapeAttr(cat.name):'')+'"></span>';
      }).join('');
      if(journalMap[dStr] && journalMap[dStr].words > 0){
        dotsHtml += '<span class="cal-dot-journal" title="Journal entry">📓</span>';
      }
      var isToday = dStr === todayStr;
      var isSelected = calendarSelectedDay === dStr;
      cells += '<button class="cal-day-cell'+(isToday?' cal-today':'')+(isSelected?' cal-selected':'')+'" data-cal-day="'+dStr+'" style="background:'+CAL_HEAT[level]+'" title="'+mins+'m logged">' +
        '<span class="cal-day-num">'+day+'</span>' +
        (dotsHtml ? '<div class="cal-day-dots">'+dotsHtml+'</div>' : '') +
      '</button>';
    }

    var weekdayLabels = ['S','M','T','W','T','F','S'].map(function(l){ return '<div class="cal-weekday">'+l+'</div>'; }).join('');
    var detailHtml = calendarSelectedDay ? calendarDayDetailHtml(calendarSelectedDay) : '';

    return '<div class="calendar-card">' +
      '<div class="calendar-header">' +
        '<button class="chip-freq-btn" data-cal-nav="-1" title="Previous month">‹</button>' +
        '<span class="calendar-month-label">'+monthLabel+'</span>' +
        '<button class="chip-freq-btn" data-cal-nav="1" title="Next month">›</button>' +
        '<button class="calendar-today-btn" data-cal-today>Today</button>' +
      '</div>' +
      '<div class="calendar-grid calendar-weekdays">'+weekdayLabels+'</div>' +
      '<div class="calendar-grid">'+cells+'</div>' +
      detailHtml +
    '</div>';
  }

  /* ---------------- Checklist items (done/not-done instead of a duration) ---------------- */
  var CHECKLIST_MINUTES = 15; // "done" is worth the same as a 15-min log, scaled by the candy multiplier
  function isDoneToday(catId, typeId){
    var today = localDateStr(Date.now());
    return entriesFor(catId, typeId).some(function(e){ return localDateStr(e.ts) === today; });
  }

  /* ---------------- Daily "3 things" todo list ---------------- */
  function todayKey(){ return localDateStr(Date.now()); }

  function ensureDailyTodos(){
    if(!state.dailyTodos) state.dailyTodos = {};
    var key = todayKey();
    if(!state.dailyTodos[key]){
      state.dailyTodos[key] = [ { text: '', done: false }, { text: '', done: false }, { text: '', done: false } ];
      saveState();
    }
    return state.dailyTodos[key];
  }

  /* ---------------- Sleep tracker ---------------- */
  var SLEEP_HEARTBEAT_MS = 60000;

  function fmtClock(ts){
    return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function parseTimeStr(s){
    var m = (s || '').trim().match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    var h = parseInt(m[1], 10), mnt = parseInt(m[2], 10);
    if(h < 0 || h > 23 || mnt < 0 || mnt > 59) return null;
    return h * 60 + mnt;
  }

  function trackSleepWake(){
    var now = Date.now();
    var prev = state.lastOpenTs;
    if(prev){
      var gapHours = (now - prev) / 3600000;
      var prevHour = new Date(prev).getHours();
      var nowHour = new Date(now).getHours();
      var looksLikeNight = (prevHour >= 20 || prevHour < 4);
      var looksLikeMorning = (nowHour >= 4 && nowHour < 12);
      if(gapHours >= 3 && looksLikeNight && looksLikeMorning){
        var nightKey = localDateStr(prev);
        if(!state.sleepLog) state.sleepLog = {};
        state.sleepLog[nightKey] = { autoSleep: prev, autoWake: now, sleep: prev, wake: now };
      }
    }
    state.lastOpenTs = now;
    saveState();
    setInterval(function(){ state.lastOpenTs = Date.now(); saveState(); }, SLEEP_HEARTBEAT_MS);
  }

  function getLatestSleepEntry(){
    if(!state.sleepLog) return null;
    var keys = Object.keys(state.sleepLog).sort().reverse();
    if(!keys.length) return null;
    return { key: keys[0], entry: state.sleepLog[keys[0]] };
  }

  function openSleepEditor(){
    var latest = getLatestSleepEntry();
    if(!latest){ alert('No sleep detected yet to adjust — it shows up after an evening + next-morning app open.'); return; }
    var e = latest.entry;
    var curSleep = new Date(e.sleep), curWake = new Date(e.wake);

    var sleepStr = prompt('Bedtime (HH:MM, 24h):', String(curSleep.getHours()).padStart(2,'0')+':'+String(curSleep.getMinutes()).padStart(2,'0'));
    if(sleepStr === null) return;
    var wakeStr = prompt('Wake time (HH:MM, 24h):', String(curWake.getHours()).padStart(2,'0')+':'+String(curWake.getMinutes()).padStart(2,'0'));
    if(wakeStr === null) return;

    var sleepMin = parseTimeStr(sleepStr);
    var wakeMin = parseTimeStr(wakeStr);
    if(sleepMin == null || wakeMin == null){ alert('Please use HH:MM, e.g. 23:15'); return; }

    var nightDate = dateFromStr(latest.key);
    var newSleep = new Date(nightDate);
    newSleep.setHours(Math.floor(sleepMin / 60), sleepMin % 60, 0, 0);
    if(newSleep.getHours() < 12){ newSleep.setDate(newSleep.getDate() + 1); }

    var wakeDate = new Date(nightDate);
    wakeDate.setDate(wakeDate.getDate() + 1);
    var newWake = new Date(wakeDate);
    newWake.setHours(Math.floor(wakeMin / 60), wakeMin % 60, 0, 0);

    if(newSleep.getTime() < e.autoSleep){
      alert('Bedtime can\'t be earlier than ' + fmtClock(e.autoSleep) + ' — that\'s the last time the app was open that night.');
      return;
    }
    if(newWake.getTime() < e.autoWake - 30*60000){
      alert('Wake time can\'t be more than 30 minutes earlier than ' + fmtClock(e.autoWake) + ' — that\'s when the app was first opened that morning.');
      return;
    }

    e.sleep = newSleep.getTime();
    e.wake = newWake.getTime();
    saveState();
    renderTabs();
    showToast('Sleep times updated');
  }

  function weeklyMinutes(entries){
    var cutoff = Date.now() - 7*86400000;
    return entries.filter(function(e){ return e.ts >= cutoff; })
                  .reduce(function(sum,e){ return sum + e.minutes; }, 0);
  }

  function fmtDuration(mins){
    if(mins <= 0) return '0m';
    var h = Math.floor(mins/60), m = mins%60;
    if(h && m) return h+'h '+m+'m';
    if(h) return h+'h';
    return m+'m';
  }

  function relativeTime(ts){
    var diff = Date.now() - ts;
    var mins = Math.floor(diff/60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs/24);
    var d = new Date(ts);
    var time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    if(days === 1) return 'Yesterday, ' + time;
    if(days < 7) return days + 'd ago';
    return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ', ' + time;
  }

  function entriesFor(catId, typeId){
    return state.logs.filter(function(l){
      return l.catId === catId && (typeId == null || l.typeId === typeId);
    });
  }

  function findCat(catId){ return state.categories.find(function(c){ return c.id===catId; }); }
  function findType(cat, typeId){ return cat.types.find(function(t){ return t.id===typeId; }); }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function escapeAttr(str){
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  function companionHtml(){

    return '<div class="tama-card">' +
      '<div class="tama-screen">' +
        '<div class="tama-lvl-badge">Lv ' + info.level + '</div>' +
        '<img class="tama-sprite" src="' + spriteUrl(info.stage.id) + '" alt="' + escapeAttr(info.stage.name) + '">' +
      '</div>' +
      '<div class="tama-info">' +
        '<div class="tama-name-row"><span class="tama-name">' + escapeHtml(info.stage.name) + '</span><div class="tama-pips">' + pipsHtml + '</div></div>' +
        '<div class="hp-row"><div class="hp-track"><div class="hp-fill' + hpClass + '" style="width:' + hpPct + '%"></div></div><span class="hp-label">' + info.health + ' / ' + info.maxHealth + ' HP</span></div>' +
        '<div class="tama-caption">' + escapeHtml(caption) + '</div>' +
        '<div class="xp-track"><div class="xp-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="xp-label">' + into + ' / ' + span + ' XP to next level</div>' +
      '</div>' +
    '</div>';

          '<div class="due-item-head"><span class="due-badge">⏰ Due</span><span class="due-name"><img class="candy-icon" src="'+tier.sprite+'" alt="'+tier.label+' candy"> '+escapeHtml(t.name)+'</span></div>' +
          '<div class="due-sub">'+sub+'</div>' +
          controlsHtml +
        '</div>';
      }).join('') + '</div>';
    }

    var listHtml = '<div class="type-list" data-cat="'+cat.id+'">' + cat.types.map(function(t){ return typeRowHtml(cat, t); }).join('') + '</div>';

    return '<div class="category-card" style="--cat-color:'+(cat.color||'#4fa8a0')+'">' +
      '<div class="cat-header">' +
        '<span class="cat-icon">'+(cat.icon||'📌')+'</span>' +
        '<span class="cat-name">'+escapeHtml(cat.name)+(cat.isBad?' <span class="bad-tag">bad habit</span>':'')+'</span>' +
        '<div class="cat-meta">' + streakHtml + '<span class="week-total">'+fmtDuration(weekMin)+' this wk</span></div>' +
      '</div>' +
      dueHtml + listHtml +
    '</div>';

  function widgetHtml(key){
    if(key === 'companion') return companionHtml();
    if(key === 'dailyTodos') return dailyTodosHtml();
    if(key === 'reminderAdd') return reminderAddHtml();
    if(key === 'reminderUpcoming') return reminderUpcomingHtml();
    if(key === 'sleep') return sleepHtml();
    if(key === 'journal') return journalHtml();
    if(key === 'calendar') return calendarHtml();
    if(key === 'history') return historyHtml();

  function renderTabs(){
    ensureTabs();
    var scroller = document.getElementById('tabsScroller');
    scroller.innerHTML = state.tabs.map(tabPageHtml).join('');
    renderTabsNav();
    scroller.scrollLeft = currentTabIndex * scroller.clientWidth;

      pokemonJustRolled = false;

  function renderTabsNav(){
    var nav = document.getElementById('tabsNav');
    if(currentTabIndex >= state.tabs.length) currentTabIndex = Math.max(0, state.tabs.length - 1);
    nav.innerHTML = state.tabs.map(function(tab, idx){
      return '<button class="tab-pill'+(idx===currentTabIndex?' active':'')+'" data-nav-idx="'+idx+'">'+escapeHtml(tab.name)+'</button>';
    }).join('');
    nav.querySelectorAll('[data-nav-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        goToTab(parseInt(btn.getAttribute('data-nav-idx'), 10));
      });
    });
  }

  function goToTab(idx){
    currentTabIndex = idx;
    var scroller = document.getElementById('tabsScroller');
    scroller.scrollTo({ left: idx * scroller.clientWidth, behavior: 'smooth' });
    renderTabsNav();
  }

  /* =========================================================================
     DELEGATED INTERACTIONS for everything inside #tabsScroller
     ========================================================================= */

  function wireTabsScroller(){
    var scroller = document.getElementById('tabsScroller');

    scroller.addEventListener('click', function(e){
      var t = e.target;

      var dailyCheck = t.closest('[data-daily-check]');
      if(dailyCheck){
        var idx = parseInt(dailyCheck.getAttribute('data-daily-check'), 10);
        var arr = ensureDailyTodos();
        arr[idx].done = !arr[idx].done;
        saveState();
        renderTabs();
        return;
      }

      if(t.closest('[data-sleep-edit]')){
        openSleepEditor();
        return;
      }

      var calNav = t.closest('[data-cal-nav]');
      if(calNav){
        var dir = parseInt(calNav.getAttribute('data-cal-nav'), 10);
        var nm = calendarViewMonth.month + dir;
        var ny = calendarViewMonth.year;
        if(nm < 0){ nm = 11; ny--; } else if(nm > 11){ nm = 0; ny++; }
        calendarViewMonth = { year: ny, month: nm };
        calendarSelectedDay = null;
        renderTabs();
        return;
      }
      if(t.closest('[data-cal-today]')){
        var td = new Date();
        calendarViewMonth = { year: td.getFullYear(), month: td.getMonth() };
        calendarSelectedDay = localDateStr(Date.now());
        renderTabs();
        return;
      }
      var calDayEl = t.closest('[data-cal-day]');
      if(calDayEl){
        var dsel = calDayEl.getAttribute('data-cal-day');
        calendarSelectedDay = (calendarSelectedDay === dsel) ? null : dsel;
        renderTabs();
        return;
      }

      var dueItem = t.closest('.due-item');
      if(dueItem){
        var catId = dueItem.getAttribute('data-cat');
        var typeId = dueItem.getAttribute('data-type');

        var stepBtn = t.closest('.step-btn[data-step]');
        if(stepBtn){
          var delta = parseInt(stepBtn.getAttribute('data-step'), 10);
          var input = dueItem.querySelector('.minutes-input');
          var val = parseInt(input.value, 10) || 0;
          input.value = Math.max(5, val + delta);
          return;
        }
        if(t.closest('.timer-start-btn')){
          startTimerFor(catId, typeId);
          return;
        }
        if(t.closest('.due-check-btn')){
          if(!isDoneToday(catId, typeId)) commitLog(catId, typeId, CHECKLIST_MINUTES);
          return;
        }
        if(t.closest('.log-btn')){
          var mInput = dueItem.querySelector('.minutes-input');
          var mins = parseInt(mInput.value, 10);
          if(mins > 0) commitLog(catId, typeId, mins);
          return;
        }
      }

      var checkBtn = t.closest('[data-check]');
      if(checkBtn){
        var cparts = checkBtn.getAttribute('data-check').split('|');
        if(!isDoneToday(cparts[0], cparts[1])) commitLog(cparts[0], cparts[1], CHECKLIST_MINUTES);
        return;
      }

      var openEl = t.closest('[data-open]');
      if(openEl){
        var oparts = openEl.getAttribute('data-open').split('|');
        openDetailPopup(oparts[0], oparts[1]);
        return;
      }

      if(t.closest('[data-journal-history]')){
        openJournalHistory();
        return;
      }

      if(t.closest('[data-reminder-quick-add]')){
        submitReminderQuickAdd();
        return;
      }
      if(t.closest('[data-reminder-new]')){
        openReminderDetailModal(null);
        return;
      }
      var remToggle = t.closest('[data-reminder-toggle]');
      if(remToggle){
        var rtParts = remToggle.getAttribute('data-reminder-toggle').split('|');
        toggleReminderDone(rtParts[0], rtParts[1]);
        renderTabs();
        return;
      }
      var remDel = t.closest('[data-reminder-delete]');
      if(remDel){
        var remIdDel = remDel.getAttribute('data-reminder-delete');
        var remToDel = findReminder(remIdDel);
        if(remToDel && confirm('Delete reminder "' + (remToDel.text || '(untitled)') + '"?')){
          deleteReminder(remIdDel);
          renderTabs();
        }
        return;
      }
      if(t.closest('[data-reminder-view-toggle]')){
        reminderViewMode = reminderViewMode === 'week' ? 'day' : 'week';
        renderTabs();
        return;
      }
      if(t.closest('[data-reminder-today]')){
        reminderDayIndex = 0;
        renderTabs();
        return;
      }
      var remEdit = t.closest('[data-reminder-edit]');
      if(remEdit){
        openReminderDetailModal(remEdit.getAttribute('data-reminder-edit'));
        return;
      }
    });

    scroller.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && e.target.matches('[data-reminder-quick-input]')){
        e.preventDefault();
        submitReminderQuickAdd();
      }
    });

    scroller.addEventListener('input', function(e){
      var input = e.target;
      if(input.matches('[data-journal-input]')){
        journalHandleInput(input);
      }
    });

    scroller.addEventListener('change', function(e){
      var input = e.target;
      if(input.matches('.daily-todo-input')){
        var idx = parseInt(input.getAttribute('data-daily-idx'), 10);
        var arr = ensureDailyTodos();
        arr[idx].text = input.value;
        saveState();
        return;
      }
      if(input.matches('[data-journal-input]')){
        // Full refresh only on blur — mid-typing renders would reset the cursor/focus.
        clearTimeout(journalSaveDebounce);
        saveState();
        renderTabs();
      }
    });

    scroller.addEventListener('scroll', function(){
      clearTimeout(scroller._scrollDebounce);
      scroller._scrollDebounce = setTimeout(function(){
        var idx = Math.round(scroller.scrollLeft / Math.max(1, scroller.clientWidth));
        if(idx !== currentTabIndex && idx >= 0 && idx < state.tabs.length){
          currentTabIndex = idx;
          renderTabsNav();
        }
      }, 80);
    });
  }

  window.addEventListener('resize', function(){
    var scroller = document.getElementById('tabsScroller');
    if(scroller) scroller.scrollLeft = currentTabIndex * scroller.clientWidth;
    var remScroller = document.getElementById('reminderDayScroller');
    if(remScroller) remScroller.scrollLeft = reminderDayIndex * remScroller.clientWidth;
  });

  /* =========================================================================
     DETAIL POPUP
     ========================================================================= */

  function renderDetailPopup(catId, typeId){
    var cat = findCat(catId);
    var type = cat && findType(cat, typeId);
    if(!cat || !type){ closeModals(); return; }

    var entries = entriesFor(catId, typeId);
    var sInfo = streakInfo(entries);
    var infoText;
    if(sInfo.type === 'active'){
      infoText = '🔥 '+sInfo.streak+'-day streak';
    } else if(sInfo.type === 'stale'){
      infoText = sInfo.daysAgo + 'd since last logged';
    } else {
      infoText = 'Never logged';
    }

    var tier = getMultiplierTier(type);
    var weekMin = weeklyMinutes(entries);
    var doneToday = isDoneToday(catId, typeId);

    var html =
      '<div class="detail-header">' +
        '<span class="detail-cat-icon">'+(cat.icon||'📌')+'</span>' +
        '<div>' +
          '<div class="detail-title"><img class="candy-icon" src="'+tier.sprite+'" alt="'+tier.label+' candy"> '+escapeHtml(type.name)+'</div>' +
          '<div class="detail-sub">'+escapeHtml(cat.name)+
            (cat.isBad ? ' <span class="bad-tag">bad habit</span>' : '') +
            (type.freq ? ' <span class="freq-badge">'+fmtFreq(type.freq)+'</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="detail-stats">' +
        '<div class="detail-stat"><span class="detail-stat-label">Status</span><span class="detail-stat-value">'+infoText+'</span></div>' +
        '<div class="detail-stat"><span class="detail-stat-label">This week</span><span class="detail-stat-value">'+fmtDuration(weekMin)+'</span></div>' +
        '<div class="detail-stat"><span class="detail-stat-label">Worth</span><span class="detail-stat-value">'+tier.mult+'x</span></div>' +
      '</div>' +
      '<div class="detail-heatmap-label">Last 14 days</div>' +
      heatmapHtml(catId, typeId, cat.isBad, true);

    if(type.isChecklist){
      html += '<button class="primary-btn detail-check-btn" id="detailCheckBtn"'+(doneToday?' disabled':'')+'>'+(doneToday?'✓ Done today':'Mark done')+'</button>';
    } else {
      html +=
        '<div class="log-controls" style="margin-top:18px;">' +
          '<button class="step-btn" data-step="-5">−5</button>' +
          '<input type="number" class="minutes-input" id="detailMinutesInput" value="15" min="5" step="5">' +
          '<button class="step-btn" data-step="5">+5</button>' +
          '<button class="step-btn" id="detailTimerBtn" title="Start a timer instead">⏱</button>' +
          '<button class="log-btn" id="detailLogBtn">Log</button>' +
        '</div>' +
        '<div class="log-confirm" id="detailLogConfirm">Logged!</div>';
    }

    document.getElementById('detailContent').innerHTML = html;

    if(type.isChecklist){
      var checkBtn = document.getElementById('detailCheckBtn');
      if(checkBtn && !doneToday){
        checkBtn.addEventListener('click', function(){
          commitLog(catId, typeId, CHECKLIST_MINUTES);
          renderDetailPopup(catId, typeId);
        });
      }
    } else {
      var input = document.getElementById('detailMinutesInput');
      document.querySelectorAll('#detailContent .step-btn[data-step]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var delta = parseInt(btn.getAttribute('data-step'), 10);
          var val = parseInt(input.value, 10) || 0;
          input.value = Math.max(5, val + delta);
        });
      });
      document.getElementById('detailTimerBtn').addEventListener('click', function(){
        closeModals();
        startTimerFor(catId, typeId);
      });
      document.getElementById('detailLogBtn').addEventListener('click', function(){
        var mins = parseInt(input.value, 10);
        if(!mins || mins <= 0) return;
        var confirmEl = document.getElementById('detailLogConfirm');
        confirmEl.style.display = 'block';
        setTimeout(function(){ if(confirmEl) confirmEl.style.display='none'; }, 900);
        commitLog(catId, typeId, mins);
        renderDetailPopup(catId, typeId);
      });
    }
  }

  function openDetailPopup(catId, typeId){
    renderDetailPopup(catId, typeId);
    document.getElementById('detailModal').classList.remove('hidden');
  }

        renderManageContent();
        renderTabs();
      });
    });

    manageContent.querySelectorAll('[data-freq-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-freq-edit').split('|');
        var catId = parts[0], typeId = parts[1];
        var cat = findCat(catId);
        var type = findType(cat, typeId);
        var current = type.freq ? (type.freq.n + type.freq.unit) : '';
        var val = prompt('Repeat frequency for "'+type.name+'" (e.g. "2w" for every 2 weeks, "10d" for every 10 days). Leave blank to remove.', current);
        if(val === null) return;
        val = val.trim();
        if(!val){
          delete type.freq;
        } else {
          var freq = parseFrequencyString(val);
          if(!freq){ alert('Could not understand that. Try a format like "2w" or "10d".'); return; }
          type.freq = freq;
        }
        saveState();
        renderManageContent();
        renderTabs();
      });
    });

    manageContent.querySelectorAll('[data-cycle-mult]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-cycle-mult').split('|');
        var cat = findCat(parts[0]);
        var type = findType(cat, parts[1]);
        cycleMultiplierTier(type);
        saveState();
        renderManageContent();
        renderTabs();
        var tier = getMultiplierTier(type);
        showToast(type.name + ' now worth ' + tier.mult + 'x (' + tier.label + ' candy)');
      });
    });

    manageContent.querySelectorAll('[data-toggle-checklist]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-toggle-checklist').split('|');
        var cat = findCat(parts[0]);
        var type = findType(cat, parts[1]);
        type.isChecklist = !type.isChecklist;
        saveState();
        renderManageContent();
        renderTabs();
        showToast(type.name + ' is now a ' + (type.isChecklist ? 'TODO checkbox' : 'timed activity'));
      });
    });

    manageContent.querySelectorAll('[data-del-cat]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var catId = btn.getAttribute('data-del-cat');
        var cat = findCat(catId);
        var count = entriesFor(catId, null).length;
        var msg = 'Delete "'+cat.name+'" and its activities?' + (count ? ' This will also remove '+count+' logged entr'+(count===1?'y':'ies')+'.' : '');
        if(!confirm(msg)) return;
        state.categories = state.categories.filter(function(c){ return c.id!==catId; });
        state.logs = state.logs.filter(function(l){ return l.catId!==catId; });
        state.tabs.forEach(function(tab){ tab.widgets = tab.widgets.filter(function(w){ return w !== catId; }); });
        delete openTypeByCat[catId];
        saveState();
        renderManageContent();
        renderTabs();
      });
    });

    manageContent.querySelectorAll('[data-del-type]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-del-type').split('|');
        var catId = parts[0], typeId = parts[1];
        var cat = findCat(catId);
        var type = findType(cat, typeId);
        var count = entriesFor(catId, typeId).length;
        var msg = 'Delete "'+type.name+'"?' + (count ? ' This will also remove '+count+' logged entr'+(count===1?'y':'ies')+'.' : '');
        if(!confirm(msg)) return;
        cat.types = cat.types.filter(function(t){ return t.id!==typeId; });
        state.logs = state.logs.filter(function(l){ return !(l.catId===catId && l.typeId===typeId); });
        if(openTypeByCat[catId] === typeId) openTypeByCat[catId] = null;
        saveState();
        renderManageContent();
        renderTabs();
      });
    });

    manageContent.querySelectorAll('[data-quick-add]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var catId = btn.getAttribute('data-quick-add');
        var input = document.getElementById('quickType_'+catId);
        var raw = input.value.trim();
        if(!raw) return;
        var parsed = parseFrequencyFromName(raw);
        if(!parsed.name) return;
        var newType = { id: uid('t'), name: parsed.name };
        if(parsed.freq) newType.freq = parsed.freq;
        findCat(catId).types.push(newType);
        saveState();
        renderManageContent();
        renderTabs();
      });
    });

    document.getElementById('addCatBtn').addEventListener('click', function(){
      var nameInput = document.getElementById('newCatName');
      var iconInput = document.getElementById('newCatIcon');
      var badInput = document.getElementById('newCatBad');
      var name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      var isBad = !!(badInput && badInput.checked);
      var icon = iconInput.value.trim() || (isBad ? '⚠' : '📌');
      var newCat = { id: uid('cat'), name: name, icon: icon, color: selectedColor, isBad: isBad, types: [] };
      state.categories.push(newCat);
      if(state.tabs[currentTabIndex]) state.tabs[currentTabIndex].widgets.push(newCat.id);
      saveState();
      nameInput.value = '';
      iconInput.value = '';
      if(badInput) badInput.checked = false;
      renderManageContent();
      renderTabs();
    });
  }

  document.getElementById('journalModalContent').addEventListener('click', function(e){
    var backBtn = e.target.closest('[data-journal-back]');
    if(backBtn){ openJournalHistory(); return; }
    var viewBtn = e.target.closest('[data-journal-view]');
    if(viewBtn){ viewJournalEntry(viewBtn.getAttribute('data-journal-view')); return; }
  });

  document.getElementById('manageBtn').addEventListener('click', openManageModal);
  document.querySelectorAll('[data-close]').forEach(function(btn){
    btn.addEventListener('click', closeModals);
  });
  document.querySelectorAll('.modal-overlay').forEach(function(overlay){
    overlay.addEventListener('click', function(e){
      if(e.target === overlay) closeModals();
    });
  });

  /* =========================================================================
     TIMER POPUP
     ========================================================================= */

  var timerTickInterval = null;
  var timerMoveInterval = null;

  function fmtTimerReadout(ms){
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    var text = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    return hh > 0 ? String(hh).padStart(2, '0') + ':' + text : text;
  }

  function updateTimerReadout(){
    if(!state.activeTimer) return;
    document.getElementById('timerReadout').textContent = fmtTimerReadout(Date.now() - state.activeTimer.startTs);
  }

  function startTimerSpriteMovement(){
    var screen = document.getElementById('timerScreen');
    var sprite = document.getElementById('timerSprite');
    function moveOnce(){
      var maxX = Math.max(0, screen.clientWidth - sprite.clientWidth);
      var curX = parseFloat(sprite.style.left || '0');
      var newX = Math.random() * maxX;
      sprite.style.transition = 'left 1.8s linear';
      sprite.style.transform = newX < curX ? 'scaleX(-1)' : 'scaleX(1)';
      sprite.style.left = newX + 'px';
    }
    clearInterval(timerMoveInterval);
    moveOnce();
    timerMoveInterval = setInterval(moveOnce, 2200);
  }
  function stopTimerSpriteMovement(){
    clearInterval(timerMoveInterval);
    timerMoveInterval = null;
  }

  function startTimerFor(catId, typeId){
    if(state.activeTimer && (state.activeTimer.catId !== catId || state.activeTimer.typeId !== typeId)){
      alert('A timer is already running for another activity. Finish or cancel it first.');
      openTimerPopup(state.activeTimer.catId, state.activeTimer.typeId, state.activeTimer.startTs);
      return;
    }
    openTimerPopup(catId, typeId, (state.activeTimer && state.activeTimer.startTs) || Date.now());
  }

  function openTimerPopup(catId, typeId, startTs){
    var cat = findCat(catId);
    var type = cat && findType(cat, typeId);
    if(!cat || !type){
      state.activeTimer = null;
      saveState();
      return;
    }
    state.activeTimer = { catId: catId, typeId: typeId, startTs: startTs || Date.now() };
    saveState();

    document.getElementById('timerTitle').textContent = (cat.icon || '📌') + ' ' + type.name;
    var info = getPokemonInfo();
    var sprite = document.getElementById('timerSprite');
    sprite.src = spriteUrl(info.stage.id);
    sprite.alt = info.stage.name;
    sprite.style.left = '0px';
    sprite.style.transform = 'scaleX(1)';

    updateTimerReadout();
    document.getElementById('timerModal').classList.remove('hidden');
    startTimerSpriteMovement();
    clearInterval(timerTickInterval);
    timerTickInterval = setInterval(updateTimerReadout, 1000);
  }

  function closeTimerPopup(){
    clearInterval(timerTickInterval);
    timerTickInterval = null;
    stopTimerSpriteMovement();
    document.getElementById('timerModal').classList.add('hidden');
  }

  document.getElementById('timerCancelBtn').addEventListener('click', function(){
    state.activeTimer = null;
    saveState();
    closeTimerPopup();
    showToast('Timer cancelled');
  });

  document.getElementById('timerStopBtn').addEventListener('click', function(){
    var t = state.activeTimer;
    closeTimerPopup();
    if(!t){ return; }
    var elapsedMin = Math.max(1, Math.round((Date.now() - t.startTs) / 60000));
    state.activeTimer = null;
    saveState();
    commitLog(t.catId, t.typeId, elapsedMin);
  });

  /* =========================================================================
     WEATHER-based companion caption (Open-Meteo, no API key)
     ========================================================================= */

  function fetchWeatherMessage(){
    var lastFetch = localStorage.getItem('lastWeatherFetch');
    if(lastFetch && (Date.now() - new Date(lastFetch).getTime()) < 10000){
      console.log('Weather fetch skipped (last fetch was less than 10s ago).');
      return;
    }
    localStorage.setItem('lastWeatherFetch', new Date().toISOString());
    var geo = navigator.geolocation;
    if (geo) {
      geo.getCurrentPosition(async function(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        await fetchWeather(lat, lon);
      }, async function(error) {
        console.warn('Geolocation failed, using default location (Sydney, AU).', error);
        await fetchWeather(-33.8688, 151.2093);
      });
    } else {
      console.warn('Geolocation not supported, using default location (Sydney, AU).');
      fetchWeather(-33.8688, 151.2093);
    }

    async function fetchWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true';
      console.log('Fetching weather from:', url);
      try {
        const resp = await fetch(url);
        const data = await resp.json();
        console.log('Weather data:', data, resp);
        if(!data || !data.current_weather) return;

        let weathercode = data.current_weather.weathercode;
        let temp = data.current_weather.temperature;
        console.log('Weather code:', weathercode, 'Temp:', temp);

        let weatherCondition = '';
        if (weathercode === 0) weatherCondition = 'sunny';
        else if (weathercode === 1 || weathercode === 2) weatherCondition = 'partly cloudy';
        else if (weathercode === 3) weatherCondition = 'cloudy';
        else if (weathercode === 61 || weathercode === 63 || weathercode === 65) weatherCondition = 'rainy';
        else if (weathercode === 71 || weathercode === 73 || weathercode === 75) weatherCondition = 'snowy';
        else weatherCondition = 'unpredictable';

        let pokemonType = getPokemonInfo().line.type;

        let possibleMessages = [];
        getPokemonInfo().line.messages && getPokemonInfo().line.messages.forEach(function(msgObj) {
          if (msgObj.type === 'happy' && (weatherCondition === 'sunny' || weatherCondition === 'partly cloudy')) {
            possibleMessages.push(msgObj.msg);
          } else if (msgObj.type === 'sad' && (weatherCondition === 'rainy' || weatherCondition === 'snowy')) {
            possibleMessages.push(msgObj.msg);
          } else if (msgObj.type === 'happy' && weatherCondition === 'unpredictable') {
            possibleMessages.push(msgObj.msg);
          }
        });
        possibleMessages = possibleMessages.concat(type_x_weather_condition_messages[pokemonType][weatherCondition] || []);

        possibleMessages = possibleMessages.map(function(msg) {
          msg = msg.toLowerCase();
          msg = msg.replace(/your |.*?type|/gi, '');
          return msg.replace(/your .* pokemon|pokemon|Pokémon|POKEMON/gi, getPokemonInfo().stage.name);
        });

        console.log('Possible messages:', possibleMessages);
        if (possibleMessages.length > 0) {
          var randomIndex = Math.floor(Math.random() * possibleMessages.length);
          var randomMessage = possibleMessages[randomIndex];
          localStorage.setItem('tamaCaption', randomMessage);
        } else {
          localStorage.setItem('tamaCaption', getPokemonInfo().stage.name + ' is feeling neutral.');
        }
        renderTabs();

      } catch (err) {
        console.warn('Weather fetch failed:', err);
      };
    }
  }

  /* =========================================================================
     INIT
     ========================================================================= */

  trackSleepWake();
  wireTabsScroller();
  renderTabs();
  fetchWeatherMessage();

  if(state.activeTimer){
    openTimerPopup(state.activeTimer.catId, state.activeTimer.typeId, state.activeTimer.startTs);
  }
})();

</script>
