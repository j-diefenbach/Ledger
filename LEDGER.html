<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokeLog</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12151a">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#12151a;
    --surface:#1b2027;
    --surface-2:#232a33;
    --surface-3:#2b333f;
    --cream:#f1e8d6;
    --cream-dim:#dccfab;
    --ink:#241f16;
    --text:#ece8e0;
    --text-dim:#9aa3ad;
    --text-faint:#5c6572;
    --accent:#e8a33d;
    --accent-dim:#7a5a26;
    --accent2:#4fa8a0;
    --danger:#d9695a;
    --line:#2f3742;
    --font-display:'Space Grotesk', 'Arial Black', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius:14px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(232,163,61,0.07), transparent 45%),
      radial-gradient(circle at 90% 30%, rgba(79,168,160,0.06), transparent 40%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:40px;
  }

  #app{
    max-width:480px;
    margin:0 auto;
    padding:0 16px 24px;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:22px 2px 18px;
    position:sticky;
    top:0;
    background:linear-gradient(var(--bg) 80%, transparent);
    z-index:5;
  }
  .stamp-mark{
    width:34px; height:34px;
    border-radius:50%;
    border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:13px;
    flex-shrink:0;
    transform:rotate(-8deg);
  }
  .topbar h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    margin:0;
    flex:1;
  }
  .topbar h1 span{ color:var(--accent); }
  .icon-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    width:40px; height:40px;
    border-radius:10px;
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{ background:var(--surface-3); }

  /* ---------- Category cards ---------- */
  /* ---------- Tamagotchi companion ---------- */
  .tama-card{
    background:var(--cream);
    border-radius:20px;
    padding:12px;
    display:flex;
    gap:14px;
    align-items:stretch;
    margin-bottom:18px;
    position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 6px 16px rgba(0,0,0,0.25);
  }
  .tama-card::before, .tama-card::after,
  .tama-screws span{ }
  .tama-screws{
    position:absolute; inset:6px;
    pointer-events:none;
  }
  .tama-screws span{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--cream-dim);
    box-shadow:inset 0 1px 1px rgba(0,0,0,0.35);
  }
  .tama-screws span:nth-child(1){ top:0; left:0; }
  .tama-screws span:nth-child(2){ top:0; right:0; }
  .tama-screws span:nth-child(3){ bottom:0; left:0; }
  .tama-screws span:nth-child(4){ bottom:0; right:0; }

  .tama-screen{
    width:104px;
    height:104px;
    flex-shrink:0;
    border-radius:14px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 35% 25%, #1c2a28, var(--bg) 75%);
    border:3px solid var(--ink);
    box-shadow:inset 0 0 0 2px rgba(232,163,61,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .tama-sprite{
    /* width:100px; */
    /* height:100px; */
    width:80px;
    /* height:100px; */
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    /* animation:tamaBob 2.4s ease-in-out infinite; */
    filter:drop-shadow(0 3px 2px rgba(0,0,0,0.4));
  }
  @keyframes tamaBob{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  .tama-lvl-badge{
    position:absolute;
    top:5px; left:5px;
    background:rgba(0,0,0,0.55);
    color:var(--accent);
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:6px;
    letter-spacing:0.5px;
    z-index:1;
  }

  .tama-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    color:var(--ink);
  }
  .tama-name-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .tama-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
  }
  .tama-caption{
    font-size:11px;
    color:#6b6250;
  }
  .tama-pips{
    display:flex;
    gap:4px;
    margin-left:auto;
  }
  .tama-pips span{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--cream-dim);
    border:1px solid #a8977a;
  }
  .tama-pips span.filled{ background:var(--accent); border-color:var(--accent); }

  .xp-track{
    height:9px;
    background:rgba(36,31,22,0.15);
    border-radius:5px;
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius:5px;
    transition:width 0.5s ease;
    width:0%;
  }
  .xp-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:#6b6250;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 12px);
    background:var(--ink);
    color:var(--cream);
    font-size:13px;
    font-weight:600;
    padding:11px 18px;
    border-radius:30px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    z-index:80;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    max-width:88%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  .category-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }

  .category-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 14px;
    position:relative;
    overflow:hidden;
  }
  .category-card::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--cat-color, var(--accent2));
  }

  .cat-header{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cat-icon{ font-size:20px; width:26px; text-align:center; flex-shrink:0; }
  .cat-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cat-meta{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; }

  .streak-stamp{
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .streak-stamp.active{ color:var(--accent); border:1px solid var(--accent-dim); background:rgba(232,163,61,0.08); }
  .streak-stamp.stale{ color:var(--text-faint); border:1px solid var(--line); }
  .streak-stamp.none{ color:var(--text-faint); border:1px solid var(--line); }

  .week-total{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--accent2);
  }

  .type-select{
    width:100%;
    margin-top:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    padding:11px 12px;
    border-radius:10px;
    appearance:none;
  }

  .type-detail{
    margin-top:12px;
    background:var(--surface-2);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:12px;
  }
  .type-detail[hidden]{ display:none; }

  .type-overview{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .type-overview .t-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
  }
  .type-overview .t-info{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
  }

  .log-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .step-btn{
    width:38px; height:38px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--surface-3);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:700;
    flex-shrink:0;
    cursor:pointer;
  }
  .step-btn:active{ background:var(--accent-dim); }
  .minutes-input{
    flex:1;
    min-width:0;
    text-align:center;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--accent);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:16px;
    padding:9px 4px;
    border-radius:9px;
  }
  .minutes-input::-webkit-outer-spin-button,
  .minutes-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .log-btn{
    background:var(--accent);
    color:#211505;
    border:none;
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    padding:0 16px;
    height:38px;
    border-radius:9px;
    cursor:pointer;
    flex-shrink:0;
  }
  .log-btn:active{ filter:brightness(0.9); }
  .log-confirm{
    margin-top:8px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--accent2);
    display:none;
  }

  .add-type-form{ display:flex; gap:8px; margin-top:10px; }
  .add-type-form input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:9px;
    font-size:14px;
  }
  .add-type-form button{
    background:var(--accent2);
    color:#0c2320;
    border:none;
    font-weight:700;
    padding:0 14px;
    border-radius:9px;
    font-size:13px;
    cursor:pointer;
  }

  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:30px 10px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    font-size:14px;
  }

  /* ---------- Recent log (ticket stubs) ---------- */
  .recent-log h2{
    font-family:var(--font-display);
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 10px 4px;
  }
  .log-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .log-item{
    background:var(--cream);
    color:var(--ink);
    border-radius:10px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    background-image: radial-gradient(circle 5px at 0px 50%, var(--bg) 99%, transparent 100%),
                       radial-gradient(circle 5px at 100% 50%, var(--bg) 99%, transparent 100%);
  }
  .log-item .li-icon{ font-size:17px; width:22px; text-align:center; flex-shrink:0; }
  .log-item .li-main{ flex:1; min-width:0; }
  .log-item .li-title{ font-weight:600; font-size:13.5px; }
  .log-item .li-sub{ font-family:var(--font-mono); font-size:10.5px; color:#6b6250; margin-top:1px; }
  .log-item .li-dur{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:13px;
    background:var(--ink);
    color:var(--cream);
    padding:3px 8px;
    border-radius:6px;
    flex-shrink:0;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px 18px 0 0;
    width:100%;
    max-width:480px;
    max-height:85vh;
    overflow-y:auto;
    padding:20px 18px 28px;
    position:relative;
    animation:slideUp 0.18s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0.6; } to{ transform:none; opacity:1; } }
  .modal-close{
    position:absolute; top:14px; right:14px;
    width:32px; height:32px;
    border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:18px;
    cursor:pointer;
  }
  .modal-card h2{
    font-family:var(--font-display);
    font-size:18px;
    margin:0 0 16px;
    padding-right:34px;
  }

  .manage-cat-block{
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
    background:var(--surface-2);
  }
  .manage-cat-head{
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .manage-cat-head strong{ font-family:var(--font-display); font-size:14px; flex:1; }
  .mini-danger{
    background:none; border:1px solid var(--danger); color:var(--danger);
    border-radius:7px; font-size:11px; padding:5px 9px; cursor:pointer;
  }
  .type-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .type-chip{
    background:var(--surface-3);
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 8px 5px 11px;
    font-size:12px;
    display:flex; align-items:center; gap:6px;
  }
  .type-chip button{
    background:none; border:none; color:var(--danger); font-size:14px; cursor:pointer; line-height:1;
    padding:0;
  }
  .inline-add{ display:flex; gap:6px; }
  .inline-add input{
    flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:7px 9px; border-radius:7px; font-size:12.5px;
  }
  .inline-add button{
    background:var(--accent2); color:#0c2320; border:none; border-radius:7px;
    padding:0 12px; font-size:12px; font-weight:700; cursor:pointer;
  }

  .new-cat-form{
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:6px;
  }
  .new-cat-form label{
    display:block; font-size:11px; color:var(--text-dim); margin-bottom:4px; margin-top:10px;
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .new-cat-form input, .new-cat-form select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:10px; border-radius:9px; font-size:14px;
  }
  .new-cat-form .swatches{ display:flex; gap:8px; margin-top:6px; }
  .swatch{
    width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  }
  .swatch.selected{ border-color:var(--text); }
  .primary-btn{
    width:100%; margin-top:16px;
    background:var(--accent); color:#211505; border:none;
    font-family:var(--font-display); font-weight:700; font-size:14px;
    padding:12px; border-radius:10px; cursor:pointer;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <!-- <div class="stamp-mark">L</div> -->
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeBAMAAADJHrORAAAAIVBMVEUhISEhISFKUlJ7e4ScSjqlpcXeWjrezvf/lDr/1jr///+Mng2PAAAAAXRSTlMAQObYZgAAAH5JREFUGNNjYKALEBQUROF2dHQgCTACuR1tAnC+xEyQQCJcunPVDCA/TQAHX6IDrD4tEc4Hm4eTLwLmp6U5QvlCHk1KQG6KIoyvpLpULc1JCcZnNNJapaSkpAy3v8p0KZBbCnew+GLj8vLyQIR/woHcUAEk/4aGhgriCQ/aAQCfHi5ulbG+aAAAAABJRU5ErkJggg==">
    <h1>PokeLog<span>.</span></h1>
    <button class="icon-btn" id="manageBtn" aria-label="Manage categories">
      <img width="32" height="32" src="https://img.pokemondb.net/sprites/black-white/normal/klink.png"/>
      <!-- <img src="https://github.com/PokeAPI/sprites/blob/master/sprites/items/leftovers.png?raw=true"/> -->
    </button>
    <button class="icon-btn" id="bag" aria-label="Bag">
      <img src="https://github.com/PokeAPI/sprites/blob/master/sprites/items/gen5/berry-pouch.png?raw=true"/>
    </button>
  </div>

  <div class="tama-card" id="tamaCard">
    <div class="tama-screws"><span></span><span></span><span></span><span></span></div>
    <div class="tama-screen">
      <div class="tama-lvl-badge" id="tamaLvlBadge">Lv 1</div>
      <img class="tama-sprite" id="tamaSprite" src="" alt="Companion sprite">
    </div>
    <div class="tama-info">
      <div class="tama-name-row">
        <span class="tama-name" id="tamaName">—</span>
        <div class="tama-pips" id="tamaPips"><span></span><span></span><span></span></div>
      </div>
      <div class="tama-caption" id="tamaCaption">This week's companion</div>
      <div class="xp-track"><div class="xp-fill" id="tamaXpFill"></div></div>
      <div class="xp-label" id="tamaXpLabel">0 / 100 XP</div>
    </div>
  </div>

  <div class="category-list" id="categoryList"></div>

  <div class="recent-log">
    <h2>Recent activity</h2>
    <ul class="log-list" id="logList"></ul>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Manage modal -->
<div class="modal-overlay hidden" id="manageModal">
  <div class="modal-card">
    <button class="modal-close" data-close="manageModal">&times;</button>
    <h2>Manage categories</h2>
    <div id="manageContent"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'ledger_tracker_state_v1';
  var CAT_COLORS = ['#e8a33d','#4fa8a0','#c76b98','#7ea6d9','#8bbf5a','#d9695a'];

  /* ---------------- Companion (Gen I & II starters) ---------------- */
  // Sprites are the classic Pokémon Black & White front sprites, served from the
  // PokeAPI/sprites GitHub repo (community-hosted mirror, safe to hotlink/cache).

  var EVOLVE_AT_LEVEL = [1, 5, 9]; // level thresholds for stage 0 / 1 / 2 (final)
  var XP_PER_MINUTE = 10;          // 15 min log = 150 XP
  var STREAK_BONUS_PER_DAY = 10;   // extra XP per active streak day (capped below)
  var STREAK_BONUS_CAP_DAYS = 10;

  // Cumulative XP required to REACH level n+1, starting from level 1 at 0 XP.
  function xpThreshold(n){
    var total = 0;
    for(var i=1; i<=n; i++){ total += 100*i + 25*i*(i-1); }
    return total;
  }

  var DEFAULT_STATE = {
    categories: [
      { id:'cat_music', name:'Music', icon:'🎵', color:CAT_COLORS[0],
        types:[ {id:'t_piano', name:'Piano'}, {id:'t_guitar', name:'Guitar'} ] },
      { id:'cat_exercise', name:'Exercise', icon:'🏃', color:CAT_COLORS[1],
        types:[ {id:'t_run', name:'Running'}, {id:'t_gym', name:'Gym'} ] }
    ],
    logs: [] // {id, catId, typeId, minutes, ts}
  };

  var state = loadState();
  var openTypeByCat = {}; // catId -> typeId currently expanded in that card

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      var parsed = JSON.parse(raw);
      if(!parsed.categories) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      return parsed;
    }catch(e){
      console.warn('Could not read saved data, starting fresh.', e);
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.warn('Could not save data (storage may be unavailable/full).', e);
    }
  }

  function uid(prefix){
    return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
  }

  /* ---------------- Companion helpers ---------------- */
  // A simple, DST-safe "week index" (Monday-anchored) used to decide when to roll a new companion.
  function weekIndex(ts){
    var d = new Date(ts);
    var localMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var epochMonday = new Date(1970, 0, 5).getTime(); // Jan 5 1970 was a Monday
    return Math.floor((localMidnight - epochMonday) / (86400000 * 7));
  }

  var pokemonJustRolled = false;

  function ensurePokemon(){
    var wk = weekIndex(Date.now());
    if(!state.pokemon || state.pokemon.weekKey !== wk){
      var prevIdx = state.pokemon ? state.pokemon.lineIndex : -1;
      var idx = Math.floor(Math.random() * STARTER_LINES.length);
      if(STARTER_LINES.length > 1){
        while(idx === prevIdx){ idx = Math.floor(Math.random() * STARTER_LINES.length); }
      }
      var hadPrevious = !!state.pokemon;
      state.pokemon = { weekKey: wk, lineIndex: idx, xp: 0 };
      saveState();
      if(hadPrevious) pokemonJustRolled = true;
    }
  }

  function getPokemonInfo(){
    ensurePokemon();
    var line = STARTER_LINES[state.pokemon.lineIndex];
    var xp = state.pokemon.xp;
    var level = 1;
    while(xpThreshold(level) <= xp && level < 40){ level++; }

    var stageIdx = 0;
    if(level >= EVOLVE_AT_LEVEL[1]) stageIdx = 1;
    if(level >= EVOLVE_AT_LEVEL[2]) stageIdx = 2;

    var curBase = level > 1 ? xpThreshold(level - 1) : 0;
    var nextBase = xpThreshold(level);

    return {
      line: line, stageIdx: stageIdx, stage: line.stages[stageIdx],
      level: level, xp: xp, curBase: curBase, nextBase: nextBase
    };
  }

  function addPokemonXp(amount){
    ensurePokemon();
    var before = getPokemonInfo();
    state.pokemon.xp += amount;
    saveState();
    var after = getPokemonInfo();
    renderPokemon();
    if(after.stageIdx > before.stageIdx){
      showToast('✨ ' + before.stage.name + ' evolved into ' + after.stage.name + '!');
    } else {
      showToast('+' + amount + ' XP for ' + after.stage.name);
    }
  }

  var toastTimer = null;
  function showToast(message){
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  /* ---------------- date helpers ---------------- */
  function localDateStr(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dateFromStr(s){
    var parts = s.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function streakInfo(entries){
    if(!entries.length) return { type:'none' };
    var dateSet = {};
    entries.forEach(function(e){ dateSet[localDateStr(e.ts)] = true; });
    var dates = Object.keys(dateSet).sort().reverse();
    var today = localDateStr(Date.now());
    var yesterday = localDateStr(Date.now() - 86400000);
    var mostRecent = dates[0];

    if(mostRecent !== today && mostRecent !== yesterday){
      var daysAgo = Math.round((dateFromStr(today) - dateFromStr(mostRecent)) / 86400000);
      return { type:'stale', daysAgo: daysAgo };
    }

    var streak = 1;
    var cur = dateFromStr(mostRecent);
    for(var i=1; i<dates.length; i++){
      cur.setDate(cur.getDate() - 1);
      var expected = localDateStr(cur.getTime());
      if(dates[i] === expected){ streak++; } else { break; }
    }
    return { type:'active', streak: streak };
  }

  function weeklyMinutes(entries){
    var cutoff = Date.now() - 7*86400000;
    return entries.filter(function(e){ return e.ts >= cutoff; })
                  .reduce(function(sum,e){ return sum + e.minutes; }, 0);
  }

  function fmtDuration(mins){
    if(mins <= 0) return '0m';
    var h = Math.floor(mins/60), m = mins%60;
    if(h && m) return h+'h '+m+'m';
    if(h) return h+'h';
    return m+'m';
  }

  function relativeTime(ts){
    var diff = Date.now() - ts;
    var mins = Math.floor(diff/60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs/24);
    var d = new Date(ts);
    var time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    if(days === 1) return 'Yesterday, ' + time;
    if(days < 7) return days + 'd ago';
    return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ', ' + time;
  }

  function entriesFor(catId, typeId){
    return state.logs.filter(function(l){
      return l.catId === catId && (typeId == null || l.typeId === typeId);
    });
  }

  function findCat(catId){ return state.categories.find(function(c){ return c.id===catId; }); }
  function findType(cat, typeId){ return cat.types.find(function(t){ return t.id===typeId; }); }

  /* ---------------- rendering ---------------- */
  function renderAll(){
    renderPokemon();
    renderCategories();
    renderLog();
  }

  function renderPokemon(){
    var info = getPokemonInfo();
    var sprite = document.getElementById('tamaSprite');
    sprite.src = spriteUrl(info.stage.id);
    sprite.alt = info.stage.name;
    document.getElementById('tamaName').textContent = info.stage.name;
    document.getElementById('tamaLvlBadge').textContent = 'Lv ' + info.level;

    var pips = document.querySelectorAll('#tamaPips span');
    pips.forEach(function(p, i){ p.classList.toggle('filled', i <= info.stageIdx); });

    var span = info.nextBase - info.curBase;
    var into = info.xp - info.curBase;
    var pct = span > 0 ? Math.min(100, Math.round((into / span) * 100)) : 100;
    document.getElementById('tamaXpFill').style.width = pct + '%';
    document.getElementById('tamaXpLabel').textContent = into + ' / ' + span + ' XP to next level';

    if(pokemonJustRolled){
      pokemonJustRolled = false;
      showToast('A new companion appeared: ' + info.stage.name + '!');
    }
  }

  function renderCategories(){
    var container = document.getElementById('categoryList');
    container.innerHTML = '';

    if(!state.categories.length){
      container.innerHTML = '<div class="empty-state">No categories yet.<br>Tap ⚙ to add one.</div>';
      return;
    }

    state.categories.forEach(function(cat){
      var catEntries = entriesFor(cat.id, null);
      var sInfo = streakInfo(catEntries);
      var weekMin = weeklyMinutes(catEntries);

      var card = document.createElement('div');
      card.className = 'category-card';
      card.style.setProperty('--cat-color', cat.color || '#4fa8a0');

      var streakHtml;
      if(sInfo.type === 'active'){
        streakHtml = '<span class="streak-stamp active">🔥 '+sInfo.streak+' day'+(sInfo.streak===1?'':'s')+'</span>';
      } else if(sInfo.type === 'stale'){
        streakHtml = '<span class="streak-stamp stale">'+sInfo.daysAgo+'d since last</span>';
      } else {
        streakHtml = '<span class="streak-stamp none">No logs yet</span>';
      }

      var typeOptions = '<option value="">Select activity…</option>' +
        cat.types.map(function(t){ return '<option value="'+t.id+'">'+escapeHtml(t.name)+'</option>'; }).join('') +
        '<option value="__add__">+ Add new…</option>';

      card.innerHTML =
        '<div class="cat-header">' +
          '<span class="cat-icon">'+(cat.icon||'📌')+'</span>' +
          '<span class="cat-name">'+escapeHtml(cat.name)+'</span>' +
          '<div class="cat-meta">' + streakHtml + '<span class="week-total">'+fmtDuration(weekMin)+' this wk</span></div>' +
        '</div>' +
        '<select class="type-select" data-cat="'+cat.id+'">' + typeOptions + '</select>' +
        '<div class="type-detail" data-cat="'+cat.id+'" hidden></div>';

      container.appendChild(card);

      var select = card.querySelector('.type-select');
      var openType = openTypeByCat[cat.id];
      if(openType && findType(cat, openType)){
        select.value = openType;
        renderTypeDetail(cat.id, openType);
      }

      select.addEventListener('change', function(){
        var val = select.value;
        if(val === '__add__'){
          showAddTypeForm(cat.id);
          select.value = openTypeByCat[cat.id] || '';
          return;
        }
        if(!val){
          openTypeByCat[cat.id] = null;
          renderTypeDetail(cat.id, null);
          return;
        }
        openTypeByCat[cat.id] = val;
        renderTypeDetail(cat.id, val);
      });
    });
  }

  function showAddTypeForm(catId){
    var detail = document.querySelector('.type-detail[data-cat="'+catId+'"]');
    detail.hidden = false;
    detail.innerHTML =
      '<div class="add-type-form">' +
        '<input type="text" placeholder="e.g. Ukulele" maxlength="30" id="newTypeInput_'+catId+'">' +
        '<button id="newTypeConfirm_'+catId+'">Add</button>' +
      '</div>';
    var input = document.getElementById('newTypeInput_'+catId);
    input.focus();
    function confirmAdd(){
      var name = input.value.trim();
      if(!name) return;
      var cat = findCat(catId);
      var newType = { id: uid('t'), name: name };
      cat.types.push(newType);
      saveState();
      openTypeByCat[catId] = newType.id;
      renderCategories();
    }
    document.getElementById('newTypeConfirm_'+catId).addEventListener('click', confirmAdd);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') confirmAdd(); });
  }

  function renderTypeDetail(catId, typeId){
    var detail = document.querySelector('.type-detail[data-cat="'+catId+'"]');
    if(!typeId){ detail.hidden = true; detail.innerHTML=''; return; }
    var cat = findCat(catId);
    var type = findType(cat, typeId);
    if(!type){ detail.hidden = true; return; }

    var entries = entriesFor(catId, typeId);
    var sInfo = streakInfo(entries);
    var infoText;
    if(sInfo.type === 'active'){
      infoText = '🔥 '+sInfo.streak+'-day streak';
    } else if(sInfo.type === 'stale'){
      infoText = sInfo.daysAgo + 'd since last logged';
    } else {
      infoText = 'Never logged';
    }

    detail.hidden = false;
    detail.innerHTML =
      '<div class="type-overview">' +
        '<span class="t-name">'+escapeHtml(type.name)+'</span>' +
        '<span class="t-info">'+infoText+'</span>' +
      '</div>' +
      '<div class="log-controls">' +
        '<button class="step-btn" data-step="-5">−5</button>' +
        '<input type="number" class="minutes-input" value="15" min="5" step="5">' +
        '<button class="step-btn" data-step="5">+5</button>' +
        '<button class="log-btn">Log</button>' +
      '</div>' +
      '<div class="log-confirm">Logged!</div>';

    var input = detail.querySelector('.minutes-input');
    detail.querySelectorAll('.step-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var delta = parseInt(btn.getAttribute('data-step'), 10);
        var val = parseInt(input.value, 10) || 0;
        val = Math.max(5, val + delta);
        input.value = val;
      });
    });
    detail.querySelector('.log-btn').addEventListener('click', function(){
      var mins = parseInt(input.value, 10);
      if(!mins || mins <= 0) return;
      state.logs.push({ id: uid('log'), catId: catId, typeId: typeId, minutes: mins, ts: Date.now() });
      saveState();
      var confirmEl = detail.querySelector('.log-confirm');
      confirmEl.style.display = 'block';
      setTimeout(function(){ if(confirmEl) confirmEl.style.display='none'; }, 1200);

      // Award companion XP: 10 XP/minute (15 min = 150 XP), plus a bonus for an active streak.
      var postStreak = streakInfo(entriesFor(catId, typeId));
      var xpGain = mins * XP_PER_MINUTE;
      if(postStreak.type === 'active' && postStreak.streak >= 2){
        xpGain += Math.min(postStreak.streak, STREAK_BONUS_CAP_DAYS) * STREAK_BONUS_PER_DAY;
      }
      addPokemonXp(xpGain);

      renderCategories();
      renderLog();
    });
  }

  function renderLog(){
    var list = document.getElementById('logList');
    list.innerHTML = '';
    var sorted = state.logs.slice().sort(function(a,b){ return b.ts - a.ts; }).slice(0, 10);

    if(!sorted.length){
      list.innerHTML = '<div class="empty-state">No activity logged yet.</div>';
      return;
    }

    sorted.forEach(function(entry){
      var cat = findCat(entry.catId);
      if(!cat) return;
      var type = findType(cat, entry.typeId);
      var li = document.createElement('li');
      li.className = 'log-item';
      li.innerHTML =
        '<span class="li-icon">'+(cat.icon||'📌')+'</span>' +
        '<span class="li-main">' +
          '<div class="li-title">'+escapeHtml(cat.name)+' — '+escapeHtml(type ? type.name : 'Deleted activity')+'</div>' +
          '<div class="li-sub">'+relativeTime(entry.ts)+'</div>' +
        '</span>' +
        '<span class="li-dur">'+fmtDuration(entry.minutes)+'</span>';
      list.appendChild(li);
    });
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  /* ---------------- manage modal ---------------- */
  var manageModal = document.getElementById('manageModal');
  var manageContent = document.getElementById('manageContent');
  var selectedColor = CAT_COLORS[0];

  function openManageModal(){
    renderManageContent();
    manageModal.classList.remove('hidden');
  }
  function closeModals(){
    document.querySelectorAll('.modal-overlay').forEach(function(m){ m.classList.add('hidden'); });
  }

  function renderManageContent(){
    var html = '';
    if(!state.categories.length){
      html += '<div class="empty-state">No categories yet — add your first one below.</div>';
    }
    state.categories.forEach(function(cat){
      html += '<div class="manage-cat-block">' +
        '<div class="manage-cat-head">' +
          '<span style="font-size:18px">'+(cat.icon||'📌')+'</span>' +
          '<strong>'+escapeHtml(cat.name)+'</strong>' +
          '<button class="mini-danger" data-del-cat="'+cat.id+'">Delete category</button>' +
        '</div>' +
        '<div class="type-chip-row">' +
          cat.types.map(function(t){
            return '<span class="type-chip">'+escapeHtml(t.name)+'<button data-del-type="'+cat.id+'|'+t.id+'">&times;</button></span>';
          }).join('') +
          (cat.types.length===0 ? '<span style="font-size:12px;color:var(--text-faint)">No activities yet</span>' : '') +
        '</div>' +
        '<div class="inline-add">' +
          '<input type="text" placeholder="New activity name" maxlength="30" id="quickType_'+cat.id+'">' +
          '<button data-quick-add="'+cat.id+'">Add</button>' +
        '</div>' +
      '</div>';
    });

    html += '<div class="new-cat-form">' +
      '<label>New category name</label>' +
      '<input type="text" id="newCatName" placeholder="e.g. Reading" maxlength="24">' +
      '<label>Icon (emoji)</label>' +
      '<input type="text" id="newCatIcon" placeholder="📚" maxlength="4">' +
      '<label>Color</label>' +
      '<div class="swatches" id="colorSwatches"></div>' +
      '<button class="primary-btn" id="addCatBtn">Add category</button>' +
    '</div>';

    // Reroll pokemon button
    html += '<div class="new-cat-form" style="margin-top:24px; text-align:center;">' +
      '<button class="primary-btn" id="rerollBtn">Reroll companion</button>' +
    '</div>';

    // Select companion dropdown
    html += '<div class="new-cat-form" style="margin-top:24px; text-align:center;">' +
      '<label>Select companion</label>' +
      '<select id="selectCompanion">' +
        STARTER_LINES.map(function(line, idx){
          return '<option value="'+idx+'">'+line.stages[0].name+'</option>';
        }).join('') +
      '</select>' +
    '</div>';

    // Clear log button
    html += '<div class="new-cat-form" style="margin-top:24px; text-align:center;">' +
      '<button class="primary-btn" id="clearLogBtn">Clear all logs</button>' +
    '</div>';
    manageContent.innerHTML = html;

    

    // reroll button handler
    var reroll = document.getElementById('rerollBtn');
    if(reroll){
      reroll.addEventListener('click', function(){
        // force a new companion for this week
        var wk = weekIndex(Date.now());
        var prevIdx = state.pokemon ? state.pokemon.lineIndex : -1;
        var idx = Math.floor(Math.random() * STARTER_LINES.length);
        if(STARTER_LINES.length > 1){
          while(idx === prevIdx){ idx = Math.floor(Math.random() * STARTER_LINES.length); }
        }
        state.pokemon = { weekKey: wk, lineIndex: idx, xp: 0 };
        pokemonJustRolled = true;
        saveState();
        renderAll();
        showToast('Rerolled companion!');
      });
    }

    // select companion dropdown handler
    var selectComp = document.getElementById('selectCompanion');
    if(selectComp){
      selectComp.value = state.pokemon ? state.pokemon.lineIndex : 0;
      selectComp.addEventListener('change', function(){
        var idx = parseInt(selectComp.value, 10);
        var wk = weekIndex(Date.now());
        state.pokemon = { weekKey: wk, lineIndex: idx, xp: 0 };
        pokemonJustRolled = true;
        saveState();
        renderAll();
        showToast('Selected companion: ' + STARTER_LINES[idx].stages[0].name);
      });
    }

    // clear log button handler
    var clearLog = document.getElementById('clearLogBtn');
    if(clearLog){
      clearLog.addEventListener('click', function(){
        if(!confirm('Are you sure you want to clear all logged activity? This cannot be undone.')) return;
        state.logs = [];
        saveState();
        renderAll();
        showToast('All logs cleared.');
      });
    }

    // color swatches
    var swatchWrap = document.getElementById('colorSwatches');
    CAT_COLORS.forEach(function(c){
      var sw = document.createElement('div');
      sw.className = 'swatch' + (c === selectedColor ? ' selected' : '');
      sw.style.background = c;
      sw.addEventListener('click', function(){
        selectedColor = c;
        swatchWrap.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('selected'); });
        sw.classList.add('selected');
      });
      swatchWrap.appendChild(sw);
    });

    // delete category
    manageContent.querySelectorAll('[data-del-cat]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var catId = btn.getAttribute('data-del-cat');
        var cat = findCat(catId);
        var count = entriesFor(catId, null).length;
        var msg = 'Delete "'+cat.name+'" and its activities?' + (count ? ' This will also remove '+count+' logged entr'+(count===1?'y':'ies')+'.' : '');
        if(!confirm(msg)) return;
        state.categories = state.categories.filter(function(c){ return c.id!==catId; });
        state.logs = state.logs.filter(function(l){ return l.catId!==catId; });
        delete openTypeByCat[catId];
        saveState();
        renderManageContent();
        renderAll();
      });
    });

    // delete type
    manageContent.querySelectorAll('[data-del-type]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-del-type').split('|');
        var catId = parts[0], typeId = parts[1];
        var cat = findCat(catId);
        var type = findType(cat, typeId);
        var count = entriesFor(catId, typeId).length;
        var msg = 'Delete "'+type.name+'"?' + (count ? ' This will also remove '+count+' logged entr'+(count===1?'y':'ies')+'.' : '');
        if(!confirm(msg)) return;
        cat.types = cat.types.filter(function(t){ return t.id!==typeId; });
        state.logs = state.logs.filter(function(l){ return !(l.catId===catId && l.typeId===typeId); });
        if(openTypeByCat[catId] === typeId) openTypeByCat[catId] = null;
        saveState();
        renderManageContent();
        renderAll();
      });
    });

    // quick-add type per category
    manageContent.querySelectorAll('[data-quick-add]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var catId = btn.getAttribute('data-quick-add');
        var input = document.getElementById('quickType_'+catId);
        var name = input.value.trim();
        if(!name) return;
        findCat(catId).types.push({ id: uid('t'), name: name });
        saveState();
        renderManageContent();
        renderCategories();
      });
    });

    // add category
    document.getElementById('addCatBtn').addEventListener('click', function(){
      var nameInput = document.getElementById('newCatName');
      var iconInput = document.getElementById('newCatIcon');
      var name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      var icon = iconInput.value.trim() || '📌';
      state.categories.push({ id: uid('cat'), name: name, icon: icon, color: selectedColor, types: [] });
      saveState();
      nameInput.value = '';
      iconInput.value = '';
      renderManageContent();
      renderCategories();
    });
  }

  document.getElementById('manageBtn').addEventListener('click', openManageModal);
  document.querySelectorAll('[data-close]').forEach(function(btn){
    btn.addEventListener('click', closeModals);
  });
  document.querySelectorAll('.modal-overlay').forEach(function(overlay){
    overlay.addEventListener('click', function(e){
      if(e.target === overlay) closeModals();
    });
  });

  renderAll();
})();
</script>
</body>
</html>
